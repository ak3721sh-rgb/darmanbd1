: «داروهایم را می‌خورم، ورزش می‌کنم، اما هنوز آرام نیستم.» این جمله، نقطه‌ی شروع بسیاری از درمان‌های"],["p","مکمل است. عطر درمانی (Aromatherapy) یکی از قدیمی‌ترین و در دسترس‌ترین این روش‌هاست: استفاده‌ی نظام‌مند از روغن‌های ضروری (Essential Oils) گیاهان برای بهبود سلامت جسمی و روانی. این فصل، نقشه‌ی راه ماست: از تعریف و تاریخچه تا جایگاه علمی و مرزهای حرفه‌ای."],["h2","۱.۲. درمان ارتعاشی چیست؟"],["p","اصطلاح «درمان ارتعاشی» (Vibrational Therapy) به مجموعه‌ای از روش‌ها اشاره دارد که بر این فرض استوارند که بدن انسان دارای میدان‌های انرژی است و اختلال در این میدان‌ها، به بیماری می‌انجامد. عطر درمانی، سنگ درمانی و رنگ درمانی در این دسته قرار می‌گیرند."],["call","نکته‌ی مهم و صادقانه: این اصطلاح، یک چارچوب مفهومی است، نه یک واقعیت اثبات‌شده‌ی فیزیولوژیک. از نظر علمی، اثر عطر درمانی عمدتاً از طریق سیستم بویایی و سیستم لیمبیک توضیح داده می‌شود (فصل ۲)، نه از طریق «ارتعاش». مهم این است که درمانگر بداند: لازم نیست به نظریه‌ی ارتعاش «باور» داشته باشد تا عطر درمانی کار کند."],["call","مثال ملموس: یک درمانگر شکاک می‌گوید: «من به ارتعاش اعتقادی ندارم.» پاسخ: اشکالی ندارد. او می‌تواند عطر درمانی را به‌عنوان «تحریک بویایی + پاسخ هیجانی شرطی‌شده» اجرا کند و همان نتیجه را ببیند."],["h2","۱.۳. تعریف عطر درمانی"],["p","عطر درمانی، استفاده‌ی کنترل‌شده از روغن‌های ضروری (Essential Oils – روغن‌های فرار استخراج‌شده از گیاهان) برای اهداف درمانی است. این روغن‌ها از طریق استنشاق، ماساژ یا کمپرس جذب می‌شوند و بر خلق، اضطراب، خواب و برخی نشانه‌های جسمی اثر می‌گذارند."],["cap","جدول ۱.۱: سه روش اصلی مصرف"],["p","روش مکانیزم مثال"],["p","استنشاق (Inhalation) تحریک مستقیم سیستم بویایی قطره روی دستمال، دیفیوزر"],["p","ماساژ (Massage) جذب پوستی + لمس درمانی رقیق‌شده"],["p","با روغن حامل"],["p","کمپرس (Compress) جذب پوستی + گرما/سرما کمپرس گرم برای درد"],["h2","۱.۴. تاریخچه‌ی کوتاه"],["li","مصر باستان: استفاده از گیاهان معطر در مومیایی کردن و آیین‌های درمانی."],["li","یونان و روم: بقراط و جالینوس از روغن‌ها برای ماساژ درمانی استفاده می‌کردند."],["li","قرن بیستم: رنه-موریس گاتفوسه، شیمیدان فرانسوی، اصطلاح «Aromathérapie» را در سال ۱۹۳۷ ابداع کرد."],["li","دهه‌های اخیر: رشد پژوهش‌ها و ورود عطر درمانی به پروتکل‌های مراقبت مکمل در بیمارستان‌ها."],["h2","۱.۵. عطر درمانی از نگاه روان‌شناسی"],["p","از دید روان‌شناختی، عطر درمانی سه کارکرد اصلی دارد:"],["p","تنظیم هیجانی: بوها می‌توانند پاسخ‌های هیجانی شرطی‌شده را فعال یا تعدیل کنند."],["p","آرام‌سازی فیزیولوژیک: برخی روغن‌ها (مثل اسطوخودوس) بر سیستم عصبی پاراسمپاتیک اثر می‌گذارند."],["p","آیین‌سازی (Ritualization): خودِ فرایند استفاده از عطر، یک آیین آرام‌بخش است که احساس کنترل و امنیت ایجاد می‌کند."],["cap","جدول ۱.۲: کارکردهای روان‌شناختی عطر درمانی"],["p",1],["p","تنظیم هیجانی تعدیل پاسخ شرطی بوی بابونه ← آرامش"],["p","آرام‌سازی فیزیولوژیک کاهش برانگیختگی اسطوخودوس ← خواب بهتر"],["p","آیین‌سازی احساس کنترل مراسم شبانه"],["call","مثال ملموس: مراجعی که در کودکی با بوی خاصی (مثلاً عطر مادربزرگ) آرامش را تجربه کرده، امروز با همان بو احساس"],["p","امنیت می‌کند. این یک پاسخ شرطی‌شده است، نه جادو."],["h2","۱.۶. جایگاه عطر درمانی در درمان مدرن"],["p","عطر درمانی یک درمان مکمل (Complementary Therapy) است، نه جایگزین درمان‌های اصلی. در عمل:"],["li","در ترکیب با CBT برای اضطراب"],["li","در مراقبت از بیماران سرطانی (کاهش اضطراب و بهبود خواب)"],["li","در مدیریت درد مزمن"],["li","در بهبود کیفیت خواب در سالمندان"],["call","هشدار بالینی: عطر درمانی بدون ارزیابی و آموزش کافی می‌تواند خطرناک باشد. برخی روغن‌ها برای زنان باردار، کودکان و بیماران خاص ممنوع است (فصل ۱۱)."],["h2","۱.۷. چه کسانی می‌توانند عطر درمانی را بیاموزند؟"],["cap","جدول ۱.۳: مخاطبان و سطح مناسب"],["p",2],["p",3],["p",4],["p",5],["p",6],["h2",7],["p","این جزوه در چهار بخش و دوازده فصل است:"],["li","بخش ۱ (فصل ۱-۲): مبانی و علم"],["li","بخش ۲ (فصل ۳-۷): دایرةالمعارف روغن‌ها"],["li","بخش ۳ (فصل ۸-۱۰): کاربردهای درمانی"],["li","بخش ۴ (فصل ۱۱-۱۲): ایمنی، منابع و جمع‌بندی"],["p","هر فصل شامل: متن اصلی، جدول‌های کاربردی، «نکته‌ی"],["p","بالینی»، «تمرین»، و خلاصه‌ی فصل است."],["h2",8],["p","عطر درمانی را به‌عنوان یک ابزار مکمل ببین، نه «معجزه». اثربخشی آن به ارزیابی دقیق، انتخاب روغن مناسب و انتظارات واقع‌بینانه وابسته است. مراجع را تشویق کن تجربه‌اش را توصیف کند، نه اینکه فقط «بهتر شدم» بگوید."],["h2",9],["p","سه موقعیت استرس‌زا در هفته‌ی گذشته‌ات را بنویس و برای هر کدام یک بوی خوشایند (که با آرامش تداعی می‌شود) مشخص کن."],["p","یک پاراگراف توضیح بده که چرا عطر درمانی را «درمان مکمل» می‌دانی."],["cap","جدول ۱.۱ (سه روش مصرف) را از حفظ تمرین کن."],["h2",10],["li","عطر درمانی: استفاده‌ی کنترل‌شده از روغن‌های ضروری."],["li","«درمان ارتعاشی» یک چارچوب مفهومی است، نه اثبات فیزیولوژیک."],["li","سه روش مصرف: استنشاق، ماساژ، کمپرس."],["li",11],["li","سه کارکرد روان‌شناختی: تنظیم هیجانی، آرام‌سازی، آیین‌سازی."],["li","عطر درمانی مکمل درمان‌های اصلی است، نه جایگزین."],["h2",12],["p",13],["p",14],["p",15],["p","درمان ارتعاشی Vibrational Therapy"],["p",16],["p",17],["p",18],["h2",19],["p",20],["p","تصویر ۱.۱ سه روش مصرف اینفوگرافیک استنشاق/ماساژ/کمپرس"],["p","تصویر ۱.۲ تاریخچه خط زمانی از مصر تا قرن بیستم"],["p","تصویر ۱.۳ جایگاه مکمل نمودار دایره‌ای: عطر درمانی در کنار درمان اصلی"]]},{"n":2,"title":"مبانی علمی عطر درمانی","blocks":[["h2",21],["p","در فصل ۱ دیدیم عطر درمانی چیست و از کجا آمده. حالا سؤال اصلی: چرا و چگونه کار می‌کند؟ این فصل، مسیر علمی اثرگذاری روغن‌های ضروری را دنبال می‌کند: از بینی تا مغز، از سیستم بویایی تا سیستم لیمبیک، و از آنجا تا پاسخ‌های فیزیولوژیک و هیجانی. هدف این نیست که عطر درمانی را «اثبات» کنیم، بلکه این است که بدانیم چه توضیح‌های علمی برای اثرگذاری آن وجود دارد و کدام‌شان پژوهش‌محورترند."],["h2","۲.۲. مسیر بویایی: از بینی تا مغز"],["p","بویایی، تنها حسی است که مستقیماً به سیستم لیمبیک (مرکز هیجان و حافظه‌ی مغز) متصل می‌شود. برخلاف بینایی و شنوایی که ابتدا به تالاموس می‌روند، سیگنال‌های بویایی از گیرنده‌های بینی مستقیماً به آمیگدال (Amygdala – مرکز"],["p","ترس و هیجان) و هیپوکامپ (Hippocampus – مرکز حافظه) می‌روند. این مسیر مستقیم، توضیح می‌دهد چرا بوها می‌توانند خاطرات و هیجانات را با سرعت و شدت فعال کنند."],["cap","جدول ۲.۱: مسیر بویایی در مقایسه با سایر حواس"],["p","حس مسیر به مغز سرعت پاسخ هیجانی"],["p","بویایی بینی ← آمیگدال/هیپوکامپ (مستقیم) بسیار سریع"],["p","بینایی چشم ← تالاموس ← قشر متوسط"],["p","شنوایی گوش ← تالاموس ← قشر متوسط"],["p","لامسه پوست ← تالاموس ← قشر متوسط"],["call","مثال ملموس: بوی یک عطر خاص، ناگهان خاطره‌ای از کودکی را زنده می‌کند. این اتفاق، تصادفی نیست: آمیگدال و هیپوکامپ، بو و خاطره را با هم پیوند می‌دهند. در عطر درمانی، از همین مسیر برای «تداعی آرامش» استفاده می‌کنیم."],["h2","۲.۳. سیستم لیمبیک و پاسخ استرس"],["p","آمیگدال، نقش کلیدی در پاسخ به استرس دارد. وقتی تهدیدی را تشخیص می‌دهد، سیگنال‌هایی به هیپوتالاموس می‌فرستد که منجر به فعال شدن محور HPA (Hypothalamic-Pituitary-Adrenal – محور هیپوتالاموس-هیپوفیز-آدرنال) و ترشح کورتیزول می‌شود. پژوهش‌ها نشان می‌دهند برخی روغن‌های ضروری (مثل اسطوخودوس) می‌توانند فعالیت آمیگدال را تعدیل کنند و پاسخ استرس را کاهش دهند."],["cap","جدول ۲.۲: مکانیزم‌های پیشنهادی اثرگذاری"],["p",22],["p","تعدیل آمیگدال کاهش فعال‌سازی مرکز ترس اسطوخودوس ← آرامش"],["p","تأثیر بر محور HPA کاهش ترشح کورتیزول بابونه ← کاهش استرس"],["p","پاسخ شرطی‌شده تداعی بو با آرامش بوی خاص ← امنیت"],["call","توجه و انحراف جلب توجه از درد/استرس نعناع ← هوشیاری"],["call","مثال ملموس: مطالعه‌ای روی موش‌ها نشان داد استنشاق اسطوخودوس می‌تواند فعال‌سازی آمیگدال را کاهش دهد و"],["p","التهاب را تعدیل کند. این یافته، مکانیزم عصبی احتمالی اثرگذاری را نشان می‌دهد، هرچند تعمیم آن به انسان نیاز به احتیاط دارد."],["h2",23],["p","پژوهش‌های متاآنالیز در سال‌های اخیر رشد کرده‌اند. یک متاآنالیز شبکه‌ای روی ۴۸ کارآزمایی (۶۰۱۴ شرکت‌کننده) نشان داد عطر درمانی در کاهش اضطراب قبل از اقدامات پزشکی (آندوسکوپی/کولونوسکوپی) مؤثر است. مطالعه‌ی دیگری روی بیماران تحت آنژیوگرافی عروق کرونر، کاهش معنادار اضطراب را گزارش کرد. اما یک متاآنالیز روی پرستاران نشان داد عطر درمانی بر استرس و خستگی مؤثر بود، اما بر اضطراب اثر معناداری نداشت. این تناقض، نشان می‌دهد نوع روغن، روش مصرف، و جمعیت هدف در نتیجه تأثیر می‌گذارند."],["cap",24],["p",25],["p","اضطراب قبل از اقدام پزشکی کاهش معنادار متوسط تا قوی"],["p","اضطراب بیماران قلبی کاهش معنادار متوسط"],["p","استرس و خستگی پرستاران کاهش استرس و خستگی متوسط"],["p","اضطراب پرستاران بدون اثر معنادار متوسط"],["p","خواب بهبود در برخی مطالعات متوسط"],["h2",26],["p","علاوه بر مکانیزم‌های عصبی، سه مکانیزم روان‌شناختی نیز نقش دارند:"],["p","پاسخ شرطی‌شده (Conditioned Response): اگر بوی خاصی با آرامش تداعی شود، تکرار آن بو می‌تواند پاسخ آرامش را فعال کند. این همان اصلی است که در حساسیت‌زدایی سیستماتیک هم استفاده می‌شود."],["p","آیین‌سازی (Ritualization): خودِ فرایند استفاده از عطر"],["p","(قطره‌چکانی، استنشاق، ماساژ) یک آیین آرام‌بخش است که احساس کنترل و امنیت ایجاد می‌کند."],["call","توجه و انحراف (Attention/Distraction): بوهای خاص (مثل نعناع) می‌توانند توجه را از درد یا استرس منحرف کنند و آستانه‌ی ادراک را تغییر دهند."],["call","مثال ملموس: مراجعی که قبل از امتحان، یک قطره اسطوخودوس روی دستمال می‌ریزد و استنشاق می‌کند. این عمل، هم پاسخ شرطی‌شده (بوی آرامش) را فعال می‌کند، هم یک آیین شخصی می‌سازد، و هم توجه را از افکار اضطرابی منحرف می‌کند."],["h2",27],["p","اینجا باید صریح باشیم. در فایل اولیه‌ی شما، ادعاهای گسترده‌ای درباره‌ی درمان بیماری‌های جسمی (از کم‌شنوایی تا تومور) مطرح شده بود. در حالی که عطر درمانی در حوزه‌ی"],["p","اضطراب، استرس، خواب و برخی نشانه‌های جسمی شواهد قابل‌توجهی دارد، ادعای «درمان» بیماری‌های جدی، پشتیبانی علمی کافی ندارد. عطر درمانی، مکمل است، نه جایگزین درمان پزشکی."],["cap",28],["p",29],["p","کاهش اضطراب حمایت متوسط تا قوی"],["p","بهبود خواب حمایت متوسط"],["p","کاهش استرس حمایت متوسط"],["p","درمان بیماری‌های جسمی جدی بدون شواهد کافی"],["p","تغییر «ارتعاش» بدن غیرقابل راستی‌آزمایی علمی"],["h2",30],["p","مکانیزم‌ها را به مراجع به‌عنوان «توضیح احتمالی» ارائه کن، نه «حقیقت قطعی». اگر مراجع علمی‌نگر است، بر مسیر بویایی-لیمبیک و پاسخ شرطی‌شده تأکید کن. اگر مذهبی/معنوی است، می‌تواند «ارتعاش» را به‌عنوان چارچوب"],["p","شخصی خودش نگه دارد. تطبیق زبان با جهان‌بینی مراجع، بخشی از مهارت است."],["h2",31],["p","مسیر بویایی تا آمیگدال را به زبان خودت توضیح بده."],["p","یک بوی خوشایند شخصی را انتخاب کن و توضیح بده چرا با آرامش تداعی می‌شود (پاسخ شرطی‌شده)."],["cap",32],["h2",33],["li","بویایی، تنها ا: استنشاق، ماساژ، کمپرس، حمام."],["li","ایمنی: بارداری، کودکان، سالمندان، بیماران خاص."],["li",49],["h2",50],["p",13],["p","تقطیر با بخار Steam Distillation"],["p","فشار سرد Cold Press"],["p",18],["p",51],["p","دیفیوزر Diffuser"],["p","کمپرس Compress"],["p",52],["h2",53],["p",20],["p","تصویر ۳.۱ روش‌های استخراج اینفوگرافیک چهار روش"],["p","تصویر ۳.۲ جدول رقیق‌سازی نمودار قطره/میلی‌لیتر"],["p","تصویر ۳.۳ روش‌های مصرف چهار تصویر: استنشاق، ماساژ، کمپرس، حمام"]]},{"n":4,"title":"روغن‌های آرام‌بخش و ضداضطراب","blocks":[["h2",54],["p","در فصل ۳ اصول ایمنی و روش‌های مصرف را آموختیم. حالا وارد دایرةالمعارف روغن‌ها می‌شویم. این فصل، سه روغن اصلی آرام‌بخش را بررسی می‌کند: اسطوخودوس (Lavender)، بابونه (Chamomile) و بهارنارنج (Neroli). این سه، بیشترین پژوهش بالینی را در حوزه‌ی اضطراب و خواب دارند و پایه‌ی بسیاری از پروتکل‌های عطر درمانی هستند."],["h2","۴.۲. بخش الف: اسطوخودوس (Lavender)"],["p","نام علمی: Lavandula angustifolia"],["p",55],["p",56],["p","مکانیزم اثر: مطالعات نشان می‌دهند لینالیل استات (Linalyl Acetate) و لینالول (Linalool) اجزای اصلی اسطوخودوس هستند. لینالیل استات با مهار کانال‌های کلسیمی و تعدیل گیرنده‌های NMDA، مسیرهای بازدارنده را فعال می‌کند. لینالول نیز با مسدود کردن ناقلان سروتونین، سطح سروتونین خارج‌سلولی را افزایش می‌دهد."],["p","شواهد بالینی: مرورهای نظام‌مند و متاآنالیزها اثربخشی اسطوخودوس را در کاهش اضطراب و بهبود کیفیت خواب تأیید کرده‌اند. یک فرآورده‌ی استاندارد اسطوخودوس (Silexan) در آلمان به‌عنوان داروی بدون نسخه برای اضطراب تجویز می‌شود."],["cap","جدول ۴.۱: اسطوخودوس در یک نگاه"],["p",57],["p","نام علمی Lavandula angustifolia"],["p","اجزای فعال لینالول، لینالیل استات"],["p","کاربرد اصلی اضطراب، خواب، سردرد تنشی"],["p","روش مصرف استنشاق، ماساژ (رقیق‌شده)، بالش"],["p","ایمنی رقیق‌سازی لازم؛ تست حساسیت"],["call","مثال ملموس: مراجع با اضطراب قبل از امتحان. یک قطره اسطوخودوس روی دستمال، سه نفس عمیق. این کار ساده، مسیر بویایی-لیمبیک را فعال می‌کند و پاسخ آرامش را تسهیل می‌کند."],["h2","۴.۳. بخش ب: بابونه (Chamomile)"],["p","نام علمی: Matricaria chamomil ن هیچ عارضه‌ای."],["cap","جدول ۴.۳: بهارنارنج در یک نگاه"],["p",57],["p","نام علمی Citrus aurantium (گل)"],["p","کاربرد اصلی اضطراب، خواب، فشار خون"],["p",58],["p",59],["p","شواهد ایرانی تبریز (خواب/اضطراب)، تهران (قلب)"],["call","مثال ملموس: مراجع با اضطراب قبل از عمل جراحی. سه نفس عمیق از دستمال آغشته به بهارنارنج. شواهد نشان می‌دهد این مداخله‌ی ساده می‌تواند اضطراب را در محیط بیمارستان کاهش دهد."],["h2","۴.۵. جدول مقایسه‌ی سه روغن"],["p","معیار اسطوخودوس بابونه بهارنارنج"],["p","شواهد اضطراب قوی (متاآنالیز) متوسط (محدود) قوی (کارآزمایی‌های ایرانی)"],["p","شواهد خواب قوی متوسط قوی"],["p","سرعت اثر سریع (استنشاق) متوسط سریع (استنشاق)"],["p","ایمنی رقیق‌سازی تداخل دارویی عموماً ایمن"],["p","کاربرد بالینی گسترده مکمل گسترده"],["h2","۴.۶. نکته‌ی بالینی فصل"],["p","برای اضطراب حاد، استنشاق سریع‌ترین راه است. برای اضطراب مزمن، ترکیب دیفیوزر شبانه + ماساژ رقیق‌شده مؤثرتر است. همیشه با یک روغن شروع کن، نه ترکیب چند روغن در جلسه‌ی اول. اگر واکنش آلرژیک داد، می‌دانی کدام مقصر است."],["h2","۴.۷. تمرین فصل ۴"],["p","برای هر سه روغن، یک کاربرد بالینی و یک روش مصرف"],["p","بنویس."],["p","یک پروتکل ۳ روزه برای مراجع با اضطراب امتحان طراحی کن (روغن + روش + زمان)."],["cap","جدول ۴.۵ را مرور کن و برای هر روغن، یک جمله‌ی بالینی بنویس که چگونه به مراجع معرفی می‌کنی."],["h2","۴.۸. خلاصه‌ی فصل"],["li","اسطوخودوس: قوی‌ترین شواهد؛ لینالول و لینالیل استات؛ اضطراب و خواب."],["li","بابونه: شواهد محدود؛ آپیژنین؛ تداخل دارویی مهم."],["li","بهارنارنج: شواهد ایرانی قوی؛ اضطراب و خواب؛ عموماً ایمن."],["li","برای اضطراب حاد: استنشاق. برای مزمن: دیفیوزر + ماساژ."],["li","با یک روغن شروع کن."],["h2","۴.۹. واژه‌نامه‌ی دوزبانه‌ی فصل"],["p",13],["p",60],["p",61],["p",62],["p","لینالول Linalool"],["p","آپیژنین Apigenin"],["p",17],["h2","۴.۱۰. فهرست تصاویر پیشنهادی فصل"],["p",20],["p","تصویر ۴.۱ سه روغن عکس گیاه/گل هر سه"],["p","تصویر ۴.۲ جدول مقایسه اینفوگرافیک سه‌ستونی"],["p","تصویر ۴.۳ پروتکل اضطراب فلوچارت انتخاب روغن"]]},{"n":5,"title":"روغن‌های محرک و انرژی‌بخش","blocks":[["h2",63],["p","در فصل ۴ سه روغن آرام‌بخش را دیدیم. حالا به سراغ روغن‌هایی می‌رویم که انرژی، هوشیاری و تمرکز را افزایش می‌دهند: نعناع (Peppermint)، اکالیپتوس (Eucalyptus) و رزماری (Rosemary). این سه، در طیف «محرک» قرار می‌گیرند و کاربردهای متفاوتی دارند: از کاهش خستگی و بهبود تمرکز تا تسکین سردرد و احتقان تنفسی. اما دقیقاً به همین دلیل، ملاحظات ایمنی آنها جدی‌تر است."],["h2","۵.۲. بخش الف: نعناع (Peppermint)"],["p","نام علمی: Mentha × piperita"],["p",55],["p","نقش سنتی: محرک، ضداسپاسم، تسکین سردرد، کمک به گوارش"],["p","اجزای فعال: منتول (Menthol) و منتون (Menthone) اجزای اصلی هستند. منتول با تحریک گیرنده‌های سرمای پوست، احساس خنکی ایجاد می‌کند و آستانه‌ی درد را تغییر می‌دهد."],["p","شواهد بالینی (اضطراب): یک کارآزمایی تصادفی‌شده در ایران روی ۸۰ بیمار قلبی تحت کاتتریزاسیون وریدی نشان داد استنشاق نعناع، شدت درد را به‌طور معناداری کاهش داد (میانگین: ۲.۹۵ در مقابل ۳.۴۲، p=۰.۰۴۸). اضطراب در هر دو گروه کاهش یافت، اما تفاوت بین گروه‌ها معنادار نبود. مطالعه‌ی دیگری روی بیماران قلبی در بخش اورژانس نیز اثر نعناع بر اضطراب را بررسی کرده است."],["p","شواهد بالینی (سردرد): بر اساس ارزیابی EMA، استفاده از نعناع ۱۰٪ در اتانول روی پیشانی، شدت سردرد را کاهش می‌دهد."],["p","شواهد بالینی (گوارش): نعناع برای اسپاسم‌های خفیف شکم، نفخ و درد شکم (به‌ویژه در IBS) کاربرد دارد. برای این کاربرد،"],["p","کپسول‌های روده‌ای (Enteric-coated) توصیه می‌شود."],["cap","جدول ۵.۱: نعناع در یک نگاه"],["p",57],["p","نام علمی Mentha × piperita"],["p","اجزای فعال منتول، منتون"],["p","کاربرد اصلی سردرد، گوارش، خستگی"],["p","روش مصرف استنشاق، رقیق‌شده روی پوست، کپسول خوراکی (با تجویز)"],["p","ایمنی ممنوع زیر ۲ سال؛ احتیاط در ریفلاکس"],["p",64],["li","کودکان زیر ۲ سال: ممنوع. منتول می‌تواند باعث آپنه رفلکسی و اسپاسم حنجره شود."],["li","کودکان زیر ۸ سال (خوراکی): توصیه نمی‌شود."],["li","مصرف خوراکی: در افراد با بیماری کبدی، سنگ کیسه صفرا، اختلالات صفراوی ممنوع است."],["li","ریفلاکس: ممکن است سوزش سر دل را تشدید کند."],["li","تماس با چشم: پس از استفاده روی پوست، دست‌ها را بشویید؛ تماس با چشم، تحریک شدید ایجاد می‌کند."],["call","مثال ملموس: مراجع با سردرد تنشی. یک قطره نعناع را با روغن حامل رقیق کنید (۱-۲٪) و روی شقیقه‌ها بمالید (دور از چشم). یا یک قطره روی دستمال، استنشاق کنید. برای گوارش، کپسول روده‌ای نعناع (با تجویز) قبل از غذا."],["h2","۵.۳. بخش ب: اکالیپتوس (Eucalyptus)"],["p","نام علمی: Eucalyptus globulus"],["p","خانواده: مورد (Myrtaceae)"],["p","نقش سنتی: ضداحتقان، خلط‌آور، ضدعفونی‌کننده"],["p","اجزای فعال: ۱,۸-سینئول (1,8-Cineole) که به آن اوکالیپتول هم می‌گویند، جزء اصلی است."],["p","شواهد بالینی: بر اساس برچسب محصول تأییدشده، اکالیپتوس برای تسکین علامتی احتقان و سرفه و تسکین اسپاسم‌های عضلانی خفیف استفاده می‌شود. روش مصرف:"],["p","استنشاق از دستمال یا بخار آب گرم (۵۰ درجه)، یا ماساژ موضعی."],["cap","جدول ۵.۲: اکالیپتوس در یک نگاه"],["p",57],["p","نام علمی Eucalyptus globulus"],["p","اجزای فعال ۱,۸-سینئول"],["p","کاربرد اصلی احتقان، سرفه، درد عضلانی"],["p","روش مصرف استنشاق، ماساژ موضعی"],["p","ایمنی ممنوع زیر ۱ سال؛ احتیاط در آسم"],["p",64],["li","کودکان زیر ۱ سال: توصیه نمی‌شود. حتی در کودکان زیر ۲.۵ سال، استفاده‌ی پوستی و استنشاق باید محدود شود، به‌دلیل خطر اسپاسم حنجره."],["li","آسم: در افراد حساس، ممکن است علائم آسم یا رینوکونژونکتیویت را تشدید کند."],["li","مصرف خوراکی: خطرناک است. بلعیدن حتی مقادیر کم (۳.۵"],["p","میلی‌لیتر) می‌تواند کشنده باشد. هرگز نخورید."],["li","بارداری/شیردهی: اطلاعات کافی نیست؛ توصیه به اجتناب."],["call","مثال ملموس: مراجع با سرماخوردگی و احتقان. چند قطره اکالیپتوس در آب گرم (۵۰ درجه)، استنشاق بخار. یا چند قطره روی دستمال. برای درد عضلانی، رقیق‌شده با روغن حامل، ماساژ موضعی."],["h2","۵.۴. بخش ج: رزماری (Rosemary)"],["p","نام علمی: Rosmarinus officinalis"],["p",55],["p","نقش سنتی: محرک گردش خون، تقویت حافظه، تسکین درد عضلانی"],["p","اجزای فعال: ۱,۸-سینئول (۲۰-۵۰٪)، آلفا-پینن (۱۵-۲۵٪)، کامفور (۱۰-۲۵٪)."],["p","شواهد بالینی (حافظه/اضطراب): یک کارآزمایی تصادفی‌شده روی دانشجویان دانشگاه نشان داد رزماری بر عملکرد حافظه،"],["p","اضطراب، افسردگی و کیفیت خواب اثر دارد. (جزئیات بیشتر در متن کامل مقاله قابل بررسی است.)"],["p","شواهد بالینی (درد عضلانی): بر اساس ارزیا  محدود (سنت)"],["p",74],["li","صرع: به‌دلیل کامفور موجود در برخی گونه‌ها، احتیاط شدید."],["li","بارداری: اجتناب."],["li","کودکان: فقط با تجویز متخصص."],["call","مثال ملموس: مراجع با سرماخوردگی و احساس گرفتگی. چند قطره زوفا در آب گرم، استنشاق بخار. این کاربرد سنتی است و شواهد علمی قوی برای آن وجود ندارد."],["h2","۷.۵. جدول مقایسه‌ی سه روغن"],["p","معیار چوب سدر صندل زوفا"],["p","شواهد انسانی محدود (خواب/آرامش) محدود (حیوانی قوی) بسیار محدود"],["p","کاربرد اصلی خواب، آرامش اضطراب موقعیتی سنتی (تنفسی)"],["p","هزینه متوسط بسیار بالا متوسط"],["p","ایمنی رقیق‌سازی، بارداری عموماً ایمن احتیاط در صرع"],["h2",75],["p","این سه روغن، ابزارهای ظریف هستند، نه «معجزه». برای چوب سدر و صندل، شواهد امیدوارکننده اما محدود است. برای زوفا، شواهد تقریباً صفر است و بیشتر سنتی است. اگر مراجع علمی‌نگر است، صادق باش: «شواهد قوی برای اینها نداریم، اما در سنت استفاده می‌شوند و می‌توانیم امتحان"],["p","کنیم.» اگر مذهبی/معنوی است، می‌تواند جنبه‌ی آیینی را نگه دارد. صداقت، اعتماد می‌سازد."],["h2",76],["p","برای هر سه روغن، یک کاربرد سنتی و یک وضعیت شواهد بنویس."],["p","یک پروتکل خواب با چوب سدر طراحی کن (روش + دوز + زمان)."],["p",65],["h2",77],["li","چوب سدر: سدرول؛ شواهد محدود برای آرامش و خواب؛ احتیاط در بارداری."],["li","صندل: α-سانتالول؛ شواهد حیوانی قوی برای اضطراب؛ شواهد انسانی محدود؛ گران."],["li","زوفا: شواهد بسیار محدود؛ سنتی برای آرامش و تنفس؛"],["p","احتیاط در صرع."],["li","این سه، ابزارهای ظریف‌اند، نه معجزه."],["li","صداقت درباره‌ی شواهد، بخشی از مهارت است."],["h2",78],["p",13],["p",79],["p",80],["p",81],["p","سدرول Cedrol"],["p","سانتالول Santalol"],["h2",82],["p",20],["p","تصویر ۷.۱ سه روغن عکس چوب/گیاه هر سه"],["p","تصویر ۷.۲ جدول شواهد اینفوگرافیک سنت/شواهد"],["p","تصویر ۷.۳ پروتکل خواب فلوچارت چوب سدر"]]},{"n":8,"title":"عطر درمانی برای سلامت روان","blocks":[["h2",83],["p","در فصل‌های ۴ تا ۷، روغن‌ها را تک‌به‌تک شناختیم. حالا می‌رسیم به سؤال اصلی: چگونه از این روغن‌ها در کار بالینی استفاده کنیم؟ این فصل، چهار حوزه‌ی اصلی سلامت روان را بررسی می‌کند: اضطراب، افسردگی، خواب و استرس. برای هر حوزه، پروتکل، روغن‌های پیشنهادی و مثال بالینی ارائه می‌شود."],["h2","۸.۲. بخش الف: عطر درمانی و اضطراب"],["p","شیوع و اهمیت: اضطراب، شایع‌ترین اختلال روانی است. عطر درمانی، به‌عنوان یک مداخله‌ی مکمل، در کاهش اضطراب موقعیتی (قبل از عمل، امتحان، جلسه) و اضطراب مزمن (GAD) کاربرد دارد."],["p","شواهد: یک متاآنالیز شبکه‌ای روی ۴۸ کارآزمایی نشان داد عطر درمانی در کاهش اضطراب قبل از اقدامات پزشکی مؤثر است. بهارنارنج در بیماران قلبی (تهران) و شمعدانی در اضطراب پیش از عمل (مهاباد) شواهد ایرانی قوی دارند (فصل ۶)."],["cap","جدول ۸.۱: پروتکل اضطراب"],["p",84],["p","اضطراب حاد (امتحان) اسطوخودوس استنشاق دستمال ۵ دقیقه قبل"],["p","اضطراب پیش از عمل شمعدانی/بهارنارنج استنشاق ۲۰ دقیقه قبل"],["p","اضطراب مزمن اسطوخودوس + بهارنارنج دیفیوزر شبانه + ماساژ روزانه"],["p","اضطراب اجتماعی رز استنشاق قبل از موقعیت"],["call","مثال ملموس: مراجع با اضطراب امتحان. یک قطره اسطوخودوس روی دستمال، سه نفس عمیق، پنج دقیقه قبل از ورود به جلسه. این مداخله‌ی ساده، مسیر بویایی-لیمبیک را فعال می‌کند و پاسخ آرامش را تسهیل می‌کند."],["h2","۸.۳. بخش ب: عطر درمانی و افسردگی"],["p","شیوع و اهمیت: افسردگی، یکی از علل اصلی ناتوانی در جهان است. عطر درمانی، به‌عنوان مداخله‌ی مکمل، می‌تواند در بهبود خلق و کاهش نشانه‌های خفیف تا متوسط کمک کند."],["p","شواهد: رز (گل محمدی) در کاهش افسردگی مادران کودکان سرطانی (ارومیه) مؤثر بوده است (فصل ۶). یاسمن به‌عنوان روغن «ضدافسردگی» شناخته می‌شود و امواج بتا مغز را افزایش می‌دهد (فصل ۶). یک مطالعه روی بیماران افسرده نشان داد استنشاق رز، خلق را بهبود می‌بخشد. اما شواهد برای افسردگی شدید کافی نیست و عطر درمانی جایگزین دارو و روان‌درمانی نیست."],["cap","جدول ۸.۲: پروتکل افسردگی خفیف تا متوسط"],["p","هدف روغن روش زمان"],["p","بهبود خلق یاسمن استنشاق صبح"],["p","کاهش اندوه رز استنشاق عصر"],["p","افزایش انرژی نعناع/رزماری استنشاق صبح"],["call","مثال ملموس: مراجع با خلق پایین و بی‌انگیزگی. صبح: یک قطره یاسمن روی دستمال، سه نفس عمیق. عصر: یک قطره رز. این ترکیب، آیین روزانه‌ای می‌سازد که خلق را تقویت می‌کند."],["call","هشدار: در افسردگی شدید با افکار خودکشی، ارجاع فوری به روان‌پزشک. عطر درمانی، در این موارد، ممنوع است."],["h2","۸.۴. بخش ج: عطر درمانی و خواب"],["p","شیوع و اهمیت: بی‌خوابی، یکی از شایع‌ترین شکایات بالینی است. عطر درمانی، به‌عنوان یک مداخله‌ی مکمل، در بهبود کیفیت خواب کاربرد دارد."],["p","شواهد: اسطوخودوس (متاآنالیز)، بهارنارنج (کارآزمایی تبریز) و چوب سدر (مطالعه پلی‌سومنوگرافی) شواهد قابل‌توجهی دارند (فصل‌های ۴ و ۷). یک کارآزمایی در تبریز روی دانشجویان پرستاری نشان داد استنشاق بهارنارنج به مدت دو"],["p","هفته، کیفیت خواب را به‌طور معناداری بهبود داد."],["cap","جدول ۸.۳: پروتکل خواب"],["p","مشکل روغن روش زمان"],["p","بی‌خوابی شروع خواب اسطوخودوس دیفیوزر/بالش ۳۰ دقیقه قبل"],["p","بیداری مکرر بهارنارنج دیفیوزر شبانه"],["p","خواب بی‌کیفیت چوب سدر دیفیوزر شبانه"],["p","اضطراب شبانه بابونه + اسطوخودوس دیفیوزر شبانه"],["call","مثال ملموس: مراجع با بی‌خوابی. یک قطره اسطوخودوس روی گوشه بالش، ۳۰ دقیقه قبل از خواب. یا دیفیوزر با ترکیب اسطوخودوس و بهارنارنج. این آیین، به مغز سیگنال «زمان خواب» می‌دهد."],["h2","۸.۵. بخش د: عطر درمانی و استرس"],["p","شیوع و اهمیت: استرس مزمن، عامل خطر بسیاری از بیماری‌هاست. عطر درمانی می‌تواند پاسخ استرس را تعدیل"],["p","کند."],["p","شواهد: یک متاآنالیز روی پرستاران نشان داد عطر درمانی بر استرس و خستگی مؤثر بود، اما بر اضطراب اثر معناداری نداشت. این یافته، نشان می‌دهد نوع روغن و جمعیت هدف مهم است."],["cap","جدول ۸.۴: پروتکل استرس"],["p",84],["p","استرس شغلی اسطوخودوس + نعناع دیفیوزر محل کار"],["p","استرس حاد بهارنارنج استنشاق لحظه‌ای"],["p","استرس مزمن شمعدانی ماساژ رقیق‌شده هفتگی"],["p","خستگی ذهنی نعناع استنشاق صبح"],["call","مثال ملموس: مراجع با استرس شغلی. دیفیوزر محل کار با ترکیب اسطوخودوس (آرام‌بخش) و نعناع (هوشیارکننده). این ترکیب، هم استرس را کاهش می‌دهد و هم تمرکز را حفظ می‌کند."],["h2","۸.۶. جدول جمع‌بندی: پروتکل‌های سلامت روان"],["p",85],["p","اضطراب حاد اسطوخودوس/بهارنارنج قوی استنشاق"],["p","اضطراب مزمن شمعدانی/اسطوخودوس قوی (ایرانی) ترکیب"],["p","افسردگی خفیف رز/یاسمن متوسط ارجاع در شدید"],["p","خواب اسطوخودوس/بهارنارنج قوی دیفیوزر/بالش"],["p","استرس اسطوخودوس/نعناع متوسط ترکیب"],["h2","۸.۷. نکته‌ی بالینی فصل"],["p","عطر درمانی برای سلامت روان، یک ابزار مکمل است، نه جایگزین. برای اضطراب خفیف تا متوسط، می‌تواند مؤثر باشد. برای افسردگی شدید، اختلال دوقطبی، روان‌پریشی و افکار خودکشی، ارجاع فوری لازم است. عطر درمانی، در این موارد، ممنوع است."],["h2","۸.۸. تمرین فصل ۸"],["p",86],["p",87],["p","سه موقعیتی که عطر درمانی ممنوع است را فهرست کن."],["h2","۸.۹. خلاصه‌ی فصل"],["li","اضطراب: اسطوخودوس، بهارنارنج، شمعدانی (شواهد قوی)."],["li","افسردگی خفیف: رز، یاسمن (شواهد متوسط)."],["li","خواب: اسطوخودوس، بهارنارنج، چوب سدر (شواهد قوی)."],["li","استرس: اسطوخودوس + نعناع (شواهد متوسط)."],["li",88],["li",89],["h2","۸.۱۰. واژه‌نامه‌ی دوزبانه‌ی فصل"],["p",13],["p",90],["p",91],["p",92],["p",93],["p",94],["h2","۸.۱۱. فهرست تصاویر پیشنهادی فصل"],["p",20],["p","تصویر ۸.۱ پروتکل اضطراب فلوچارت انتخاب روغن"],["p","تصویر ۸.۲ پروتکل خواب اینفوگرافیک دیفیوزر/بالش"],["p","تصویر ۸.۳ جدول جمع‌بندی جدول چهار حوزه"]]},{"n":9,"title":"عطر درمانی برای سلامت جسمی","blocks":[["h2",95],["p","در فصل ۸ کاربردهای روان‌شناختی عطر درمانی را دیدیم. حالا به سراغ بدن می‌رویم: درد، سردرد و گوارش. عطر درمانی در این حوزه‌ها، عمدتاً به‌عنوان مداخله‌ی مکمل برای کاهش شدت علائم و بهبود کیفیت زندگی کاربرد دارد. اما دقیقاً به همین دلیل، مرزهای شواهد باید شفاف باشد: برای برخی کاربردها (مثل درد پس از عمل) شواهد قوی‌تری داریم و برای برخی (مثل درد مزمن) شواهد محدودتر است."],["h2","۹.۲. بخش الف: عطر درمانی و درد"],["p","درد حاد (پس از عمل، تزریق، زایمان): شواهد نسبتاً قوی. یک مرور نظام‌مند روی ۱۴۷ مطالعه نشان داد که حدود ۲۹٪ از مطالعات بالینی عطر درمانی در حوزه‌ی درد، به درد پیرامون عمل اختصاص دارد و شواهد از کاهش درد و اضطراب پیش"],["p","از عمل حمایت می‌کند."],["p","کارآزمایی ایرانی (جراحی قلب): یک کارآزمایی سه‌سوکور تصادفی‌شده روی ۱۰۴ بیمار تحت CABG (بای‌پس عروق کرونر) در ایران نشان داد استنشاق لیمو به‌طور معناداری درد پس از عمل را در تمام هشت شیفت اندازه‌گیری کاهش داد (P < 0.001). همچنین تهوع و استفراغ پس از عمل، دلیریوم و نشانگرهای التهابی (CRP و NLR) در گروه مداخله کمتر بود. این مطالعه، شواهد قوی برای درد حاد پس از عمل فراهم می‌کند."],["p","درد مزمن: شواهد محدودتر و mixed. یک مرور نظام‌مند و متاآنالیز روی ۴۲ مطالعه نشان داد عطر درمانی می‌تواند درد را کاهش دهد، اما کیفیت مطالعات متفاوت است و برای درد مزمن (مثل کمردرد، گردن‌درد) شواهد قوی‌تری لازم است. یک متاآنالیز روی بیماران همودیالیزی نشان داد اسطوخودوس درد ناشی از تزریق کاتتر را کاهش می‌دهد (SMD = -1.60)، اما وقتی با گروه دارونما مقایسه شد، تفاوت معنادار نبود (P = 0.12). این یافته، اهمیت گروه کنترل را نشان می‌دهد."],["p","درد قاعدگی (دیسمنوره): یک کارآزمایی تصادفی‌شده با دارونما روی ۶۷ دانشجوی دختر نشان داد ماساژ شکمی با ترکیب اسطوخودوس + مریم‌گلی + رز (در روغن بادام) به‌طور معناداری شدت گرفتگی قاعدگی را در روز اول و دوم قاعدگی کاهش داد. یک متاآنالیز روی گل محمدی نیز اثر آن را بر درد قاعدگی، سردرد، خستگی و اضطراب مرتبط با قاعدگی تأیید کرده است."],["cap","جدول ۹.۱: پروتکل درد"],["p","نوع درد روغن روش شواهد"],["p","پس از عمل (CABG) لیمو استنشاق قوی (کارآزمایی ایرانی)"],["p","تزریق/کاتتر اسطوخودوس استنشاق/ماساژ متوسط"],["p","قاعدگی اسطوخودوس + رز ماساژ شکمی متوسط"],["p","درد مزمن (کمر/گردن) اسطوخودوس ماساژ محدود"],["call","مثال ملموس: مراجع با درد قاعدگی. سه قطره اسطوخودوس + یک قطره رز در ۵ میلی‌لیتر روغن بادام. ماساژ ملایم شکم، روز اول و دوم قاعدگی. شواهد نشان می‌دهد این ترکیب می‌تواند شدت گرفتگی را کاهش دهد."],["h2","۹.۳. بخش ب: عطر درمانی و سردرد"],["p","سردرد تنشی: نعناع، شواهد قابل‌توجه. بر اساس ارزیابی EMA، استفاده از نعناع ۱۰٪ در اتانول روی پیشانی، شدت سردرد را کاهش می‌دهد (فصل ۵). یک متاآنالیز روی گل محمدی نیز اثر آن را بر سردرد مرتبط با قاعدگی نشان داده است."],["p","میگرن: شواهد محدود. برخی مطالعات کوچک اثر اسطوخودوس را بررسی کرده‌اند، اما کارآزمایی‌های قوی‌تر لازم است."],["cap","جدول ۹.۲: پروتکل سردرد"],["p","نوع روغن روش شواهد"],["p","تنشی نعناع ۱۰٪ مالش شقیقه (دور از چشم) متوسط (EMA)"],["p","قاعدگی گل محمدی استنشاق متوسط"],["p","میگرن اسطوخودوس استنشاق محدود"],["call","مثال ملموس: مراجع با سردرد تنشی. یک قطره نعناع را در ۹ قطره روغن حامل رقیق کنید (۱۰٪). روی شقیقه‌ها بمالید، دور از چشم. شواهد EMA از این کاربرد حمایت می‌کند."],["h2","۹.۴. بخش ج: عطر درمانی و گوارش"],["p","سندرم روده‌ی تحریک‌پذیر (IBS): نعناع، قوی‌ترین شواهد. یک متاآنالیز به‌روز (۲۰۲۶) روی ۶۰ مطالعه (۶۳۲۹ بیمار) نشان داد روغن نعناع در IBS مؤثرتر از دارونما بود (RR = 1.63؛ 95% CI: 1.33-2.00) و پروفایل ایمنی خوبی داشت. برای این کاربرد، کپسول‌های روده‌ای (Enteric-coated) توصیه می‌شود تا روغن در روده آزاد شود، نه معده."],["p","نفخ و اسپاسم: نعناع، شواهد سنتی و بالینی. چای نعناع یا کپسول روده‌ای."],["p","تهوع و استفراغ پس از عمل (PONV): شواهد متوسط. یک مرور نظام‌مند و متاآنالیز نشان داد عطر درمانی (به‌ویژه نعناع و الکل) می‌تواند شدت تهوع را کاهش دهد. کارآزمایی ایرانی روی CABG نیز کاهش PONV با لیمو را نشان داد."],["cap","جدول ۹.۳: پروتکل گوارش"],["p","مشکل روغن روش شواهد"],["p","IBS نعناع (روده‌ای) کپسول خوراکی (با تجویز) قوی"],["p","نفخ/اسپاسم نعناع چای/کپسول متوسط"],["p","PONV نعناع/لیمو استنشاق متوسط"],["call","مثال ملموس: مراجع با IBS. کپسول روده‌ای نعناع (با تجویز پزشک) قبل از غذا. شواهد متاآنالیز ۲۰۲۶ از این کاربرد حمایت می‌کند."],["h2","۹.۵. جدول جمع‌بندی: پروتکل‌های جسمی"],["p",85],["p","درد پس از عمل لیمو/اسطوخودوس قوی (ایرانی) استنشاق"],["p","درد قاعدگی اسطوخودوس + رز متوسط ماساژ شکمی"],["p","سردرد تنشی نعناع ۱۰٪ متوسط دور از چشم"],["p","IBS نعناع (روده‌ای) قوی کپسول، نه چای"],["p","PONV نعناع/لیمو متوسط استنشاق"],["h2",96],["p","در کار با درد و مشکلات جسمی، مرز شواهد را شفاف کن. برای درد حاد پس از عمل و IBS، شواهد قوی‌تری داریم. برای درد مزمن، شواهد محدودتر است. هرگز عطر درمانی را جایگزین درمان پزشکی نکن. اگر مراجع با درد قفسه سینه، سردرد ناگهانی شدید، یا علائم گوارشی هشداردهنده (خون در مدفوع، کاهش وزن) مراجعه کرد، ارجاع فوری به پزشک."],["h2",97],["p","برای یک مراجع با درد قاعدگی، یک پروتکل ماساژ طراحی کن (روغن + نسبت + زمان)."],["p","سه تفاوت بین درد حاد و مزمن از نظر شواهد عطر درمانی را بنویس."],["p",98],["h2",99],["li","درد حاد پس از عمل: لیمو/اسطوخودوس (شواهد قوی ایرانی)."],["li","درد قاعدگی: اسطوخودوس + رز (شواهد متوسط)."],["li","سردرد تنشی: نعناع ۱۰٪ (شواهد متوسط)."],["li","IBS: نعناع روده‌ای (شواهد قوی)."],["li","PONV: نعناع/لیمو (شواهد متوسط)."],["li",88],["li","علائم هشدار = ارجاع فوری."],["h2",100],["p",13],["p",101],["p",102],["p","دیسمنوره Dysmenorrhea"],["p","سندرم روده‌ی تحریک‌پذیر Irritable Bowel Syndrome (IBS)"],["p","تهوع و استفراغ پس از عمل Postoperative Nausea"],["p","and Vomiting (PONV)"],["h2",103],["p",20],["p","تصویر ۹.۱ پروتکل درد فلوچارت انتخاب روغن"],["p","تصویر ۹.۲ پروتکل IBS اینفوگرافیک کپسول روده‌ای"],["p","تصویر ۹.۳ جدول شواهد اینفوگرافیک قوی/متوسط/محدود"]]},{"n":10,"title":"عطر درمانی در جمعیت‌های خاص","blocks":[["h2",104],["p","در فصل‌های ۸ و ۹، پروتکل‌های عمومی سلامت روان و جسم را دیدیم. اما در عمل، بسیاری از مراجعان ما در گروه‌های خاص قرار می‌گیرند: کودکان، سالمندان، زنان باردار و شیرده. این گروه‌ها از نظر فیزیولوژیک، متابولیسم و حساسیت پوستی با بزرگسالان سالم متفاوت‌اند. این فصل، اصول تطبیق عطر درمانی برای این جمعیت‌ها را آموزش می‌دهد. قانون کلی: ایمنی، مقدم بر اثربخشی است."],["h2","۱۰.۲. بخش الف: عطر درمانی برای کودکان"],["p",105],["p","رقیق‌سازی بسیار پایین: ۰.۵٪ تا ۱٪ (نه بیشتر)."],["p","روش ترجیحی: استنشاق (دیفیوزر) و ماساژ ملایم."],["p","اجتناب از روغن‌های محرک: نعناع (زیر ۲ سال ممنوع)، اکالیپتوس (زیر ۱ سال ممنوع)، رزماری (زیر ۱۸ سال ممنوع)."],["p",106],["p",107],["cap","جدول ۱۰.۱: عطر درمانی برای کودکان بر اساس سن"],["p","سن رقیق‌سازی روغن‌های مجاز ممنوع"],["p","۰-۲ سال ۰.۲۵٪ (فقط با تجویز) اسطوخودوس (بسیار رقیق) نعناع، اکالیپتوس، رزماری"],["p","۲-۶ سال ۰.۵٪ اسطوخودوس، بابونه، بهارنارنج نعناع (زیر ۲ سال)، اکالیپتوس"],["p","۶-۱۲ سال ۱٪ اسطوخودوس، بابونه، بهارنارنج، شمعدانی رزماری"],["p","۱۲-۱۸ سال ۱-۲٪ اسطوخودوس، بابونه، بهارنارنج، شمعدانی، رزماری (با احتیاط) —"],["p","شواهد بالینی (کودکان): یک متاآنالیز نشان داد عطر درمانی"],["p","در کاهش درد و اضطراب کودکان مؤثر است. یک مطالعه روی کودکان مبتلا به سرطان نشان داد ماساژ با اسطوخودوس و بابونه، اضطراب را کاهش می‌دهد."],["call","مثال ملموس: کودک ۵ ساله با اضطراب جدایی. یک قطره اسطوخودوس در ۱۰۰ میلی‌لیتر آب (دیفیوزر) در اتاق خواب. یا یک قطره در ۱۰ میلی‌لیتر روغن بادام (۰.۵٪) برای ماساژ ملایم پشت. هرگز روغن خالص روی پوست کودک نزنید."],["call","هشدار جدی: در کودکان زیر ۲ سال، هرگونه استفاده از روغن‌های ضروری باید با تجویز متخصص اطفال باشد. منتول (نعناع) می‌تواند باعث آپنه رفلکسی و اسپاسم حنجره شود."],["h2","۱۰.۳. بخش ب: عطر درمانی برای سالمندان"],["p",105],["p","پوست نازک‌تر و حساس‌تر: رقیق‌سازی ۱٪."],["p","متابولیسم کندتر: دوز پایین‌تر."],["p","تداخل دارویی: سالمندان اغلب چند دارو مصرف می‌کنند"],["p","(فصل ۱۱)."],["p","روش ترجیحی: استنشاق، ماساژ ملایم، کمپرس."],["p",108],["cap","جدول ۱۰.۲: عطر درمانی برای سالمندان"],["p",109],["p","بی‌خوابی اسطوخودوس/بهارنارنج دیفیوزر/بالش رقیق‌سازی ۱٪"],["p","اضطراب اسطوخودوس/بهارنارنج استنشاق —"],["p","درد مزمن اسطوخودوس/نعناع ماساژ/کمپرس رقیق‌سازی ۱-۲٪"],["p","تنهایی بهارنارنج/رز استنشاق آیین روزانه"],["p","شواهد بالینی (سالمندان): یک مرور نظام‌مند نشان داد عطر درمانی می‌تواند در کاهش اضطراب و بهبود خواب سالمندان مؤثر باشد، اما کیفیت مطالعات متفاوت است. برای سالمندان مبتلا به دمانس، عطر درمانی (به‌ویژه اسطوخودوس) در کاهش بی‌قراری مؤثر بوده است."],["call","مثال ملموس: سالمند ۷۵ ساله با بی‌خوابی. یک قطره اسطوخودوس روی گوشه بالش، ۳۰ دقیقه قبل از خواب. یا دیفیوزر با ترکیب اسطوخودوس و بهارنارنج. نکته: قبل از شروع، لیست داروهای سالمند را بررسی کنید (فصل ۱۱)."],["h2","۱۰.۴. بخش ج: عطر درمانی در بارداری و شیردهی"],["p",105],["p","احتیاط شدید: بسیاری از روغن‌ها در بارداری ممنوع یا محدود هستند."],["p",110],["p","روش ترجیحی: استنشاق (نه ماساژ شکم)."],["p","روغن‌های مجاز (با احتیاط): اسطوخودوس، بهارنارنج، بابونه (رقیق‌شده)."],["cap","جدول ۱۰.۳: ایمنی روغن‌ها در بارداری"],["p","روغن وضعیت توضیح"],["p","اسطوخودوس با احتیاط رقیق‌شده، استنشاق"],["p","بهارنارنج با احتیاط استنشاق"],["p","بابونه با احتیاط رقیق‌شده"],["p","رزماری ممنوع خطر انقباض رحم"],["p","مریم‌گلی ممنوع خطر انقباض رحم"],["p","نعناع با احتیاط رقیق‌شده"],["p","اکالیپتوس اجتناب اطلاعات کافی نیست"],["p","شواهد بالینی (بارداری): یک مطالعه روی زنان باردار نشان داد استنشاق بهارنارنج می‌تواند اضطراب قبل از زایمان را کاهش دهد. یک مطالعه دیگر روی شمعدانی، اد کند."],["call","نکته‌ی مهم: کریستال درمانی یک درمان مکمل (Complementary Therapy) است، نه جایگزین درمان‌های اصلی. برای پزشکان، این یعنی می‌توان از آن به‌عنوان یک ابزار کمکی در کنار پروتکل‌های استاندارد استفاده"],["p","کرد."],["h2","۱.۳. تاریخچه‌ی کوتاه (از تمدن‌های باستان تا امروز)"],["li","مصر باستان: استفاده از لاجورد (Lapis Lazuli) و فیروزه (Turquoise) در طلسم‌ها و ماسک‌های درمانی."],["li","یونان باستان: «آمتیست» به معنای «نمی‌مست» است؛ یونانیان معتقد بودند این سنگ از مستی جلوگیری می‌کند."],["li","چین باستان: استفاده از یشم (Jade) برای تقویت انرژی حیاتی (چی – Qi)."],["li","هند باستان: سیستم چاکراها (Chakras) و ارتباط هر چاکرا با یک سنگ و رنگ خاص."],["li","قرن بیستم: رشد «عصر جدید» (New Age) و محبوبیت کریستال درمانی در غرب."],["li","امروز: استفاده از کریستال‌ها در محیط‌های درمانی، مدیتیشن و خودیاری."],["cap","جدول ۱.۱: خط زمانی کریستال درمانی"],["p",148],["p","مصر باستان لاجورد و فیروزه در طلسم‌ها"],["p","یونان باستان آمتیست و باورهای درمانی"],["p","چین باستان یشم و انرژی چی"],["p","هند باستان چاکراها و سنگ‌ها"],["p","قرن بیستم عصر جدید و محبوبیت"],["p","امروز کریستال درمانی در مدیتیشن و خودیاری"],["h2","۱.۴. صداقت علمی: آنچه باید بدانیم"],["p","اینجا باید صریح باشیم. برخلاف عطر درمانی و رنگ درمانی که شواهد متوسط تا قوی دارند، کریستال درمانی فاقد شواهد بالینی کنترل‌شده است. یک مطالعه‌ی کلاسیک (French et al., 2001) هیچ تفاوتی بین کریستال واقعی و تقلبی در کاهش درد یا اضطراب نیافت. بنابراین، اثر کریستال درمانی عمدتاً به پلاسیبو، آیین‌سازی، لمس حسی و توجه‌آگاهی نسبت داده می‌شود."],["cap","جدول ۱.۲: ادعاها و وضعیت شواهد در کریستال درمانی"],["p",29],["p",149],["p",150],["p",151],["p",152],["p",153],["call","نکته‌ی مهم: اثر پیزوالکتریک (Piezoelectric Effect) در کوارتز، یک پدیده‌ی فیزیکی اثبات‌شده است (تولید بار الکتریکی در اثر فشار مکانیکی). اما تعمیم این اثر به «درمان»، یک جهش علمی است که شواهد کافی ندارد."],["call","مثال ملموس: مراجع با اضطراب. درمانگر یک کریستال کوارتز شفاف (Clear Quartz) در دست او می‌گذارد و از او می‌خواهد در حین تنفس عمیق، به سردی و صافی آن توجه ک ل درمانی را به‌عنوان یک ابزار مکمل ببین، نه «معجزه». اثربخشی آن به ارزیابی دقیق، انتخاب سنگ مناسب و انتظارات واقع‌بینانه وابسته است. مراجع را تشویق کن تجربه‌اش را توصیف کند، نه اینکه فقط «بهتر شدم» بگوید. و مهم‌تر: هرگز نگو «این سنگ بیماری‌ات را درمان می‌کند»."],["h2",9],["p","سه موقعیت استرس‌زا در هفته‌ی گذشته‌ات را بنویس و برای هر کدام یک کریستال (که با آرامش تداعی می‌شود) مشخص کن."],["p","یک پاراگراف توضیح بده که چرا کریستال درمانی را"],["p","«درمان مکمل» می‌دانی."],["cap","جدول ۱.۲ (ادعاها و شواهد) را مرور کن و برای هر ادعا، یک جمله‌ی بالینی بنویس."],["h2",10],["li","کریستال درمانی: استفاده‌ی نظام‌مند از سنگ‌ها برای تأثیر بر سلامت."],["li","سه مسیر: حسی-لمسی، روان‌شناختی، آیینی (و پلاسیبو)."],["li","تاریخچه از مصر تا عصر جدید."],["li","صداقت علمی: کریستال درمانی فاقد شواهد بالینی کنترل‌شده است؛ اثر آن عمدتاً پلاسیبو و آیین‌سازی است."],["li","اثر پیزوالکتریک در فیزیک اثبات‌شده، اما در درمان نه."],["li",156],["h2",12],["p",13],["p","کریستال درمانی Crystal Therapy"],["p","سنگ درمانی Lithotherapy"],["p",16],["p",157],["p",158],["p","اثر پیزوالکتریک Piezoelectric Effect"],["p",159],["p",160],["h2",19],["p",20],["p",161],["p","تصویر ۱.۲ مسیرهای اثر اینفوگرافیک چهار مسیر"],["p","تصویر ۱.۳ جدول شواهد اینفوگرافیک ادعا/شواهد"]]},{"n":2,"title":"مبانی علمی و مکانیزم‌های پیشنهادی کریستال درمانی","blocks":[["h2",21],["p","در فصل ۱ دیدیم کریستال درمانی چیست و از کجا آمده. حالا سؤال اصلی: چرا و چگونه کار می‌کند؟ این فصل، مسیر علمی اثرگذاری کریستال را دنبال می‌کند: از خواص فیزیکی سنگ‌ها (مثل پیزوالکتریک) تا مکانیزم‌های روان‌شناختی (پلاسیبو، آیین‌سازی، لمس حسی). هدف این نیست که کریستال درمانی را «اثبات» کنیم، بلکه این است که بدانیم چه توضیح‌های علمی برای اثرگذاری آن وجود دارد و کدام‌شان پژوهش‌محورترند."],["h2","۲.۲. بخش الف: خواص فیزیکی کریستال‌ها"],["p","کریستال‌ها، ساختارهای منظم اتمی دارند که خواص فیزیکی خاصی به آنها می‌دهد. این خواص، در فیزیک و صنعت اثبات‌شده‌اند، اما تعمیم آنها به درمان نیاز به احتیاط دارد."],["cap","جدول ۲.۱: خواص فیزیکی کریستال‌ها و کاربرد صنعتی"],["p","خاصیت توضیح کاربرد صنعتی ارتباط با درمان"],["p","پیزوالکتریک (Piezoelectric) تولید بار الکتریکی در اثر فشار ساعت کوارتز، میکروفون بدون شواهد"],["p","فروالکتریک (Ferroelectric) حفظ قطبش الکتریکی حافظه‌های کامپیوتری بدون شواهد"],["p","رسانایی حرارتی انتقال گرما نیمه‌هادی‌ها بدون شواهد"],["p","ضریب شکست شکست نور جواهرات، لنز غیرمستقیم (زیبایی‌شناسی)"],["call","نکته‌ی مهم: اثر پیزوالکتریک در کوارتز، یک پدیده‌ی فیزیکی اثبات‌شده است. اما تعمیم این اثر به «درمان»، یک جهش علمی است که شواهد کافی ندارد. کوارتز در ساعت شما، بار الکتریکی تولید می‌کند، اما این بار، «انرژی درمانی» نیست."],["call","مثال ملموس: مراجع با اضطراب. درمانگر یک کوارتز شفاف در دست او می‌گذارد. اینجا، «پیزوالکتریک» نقش اصلی را بازی نمی‌کند؛ لمس سردی و صافی سنگ و آیین توجه نقش اصلی"],["p","را دارند."],["h2","۲.۳. بخش ب: مکانیزم پلاسیبو (Placebo)"],["p","تعریف: پلاسیبو، اثر یک درمان بی‌اثر (مثل یک قرص قند) است که به دلیل انتظار و باور فرد، بهبود واقعی ایجاد می‌کند. در کریستال درمانی، پلاسیبو نقش کلیدی دارد."],["p","شواهد: یک مطالعه‌ی کلاسیک (French et al., 2001) روی ۸۰ بیمار نشان داد که هیچ تفاوت معناداری بین کریستال واقعی و تقلبی در کاهش درد یا اضطراب وجود ندارد. این یافته، نشان می‌دهد که اثر کریستال، عمدتاً از باور و انتظار می‌آید، نه از خود سنگ."],["cap","جدول ۲.۲: پلاسیبو در کریستال درمانی"],["p","عامل توضیح مثال"],["p","انتظار باور به اثربخشی «این سنگ آرامم می‌کند»"],["p","آیین مراسم استفاده پاکسازی، چیدمان"],["p","رابطه درمانی اعتماد به درمانگر «او می‌داند چه می‌کند»"],["call","مثال ملموس: مراجع با اضطراب. درمانگر یک کریستال آمتیست (Amethyst) به او می‌دهد و می‌گوید: «این سنگ به آرامش کمک می‌کند.» اگر مراجع به این باور داشته باشد، ممکن است واقعاً آرام‌تر شود. این اثر، پلاسیبو است. و مهم است که درمانگر بداند: این اثر، واقعی است، حتی اگر مکانیزم آن «انرژی» نباشد."],["call","نکته‌ی بالینی: پلاسیبو را دست‌کم نگیر. در طب مکمل، پلاسیبو یک ابزار بالینی معتبر است. اما باید صادق باشی: نگو «این سنگ معجزه می‌کند»، بگو «این سنگ می‌تواند به تمرین آرامش کمک کند»."],["h2","۲.۴. بخش ج: مکانیزم آیین‌سازی (Ritualization)"],["p","تعریف: آیین‌سازی، فرایند انجام یک سری اعمال نمادین (مثل پاکسازی کریستال، چیدمان آن) است که احساس کنترل، امنیت و نظم ایجاد می‌کند."],["p","شواهد: پژوهش‌های روان‌شناختی نشان می‌دهند که آیین‌ها"],["p","می‌توانند اضطراب را کاهش دهند، حتی اگر «اثر واقعی» نداشته باشند. آیین، مغز را از «حالت تهدید» به «حالت امن» می‌برد."],["cap","جدول ۲.۳: آیین‌سازی در کریستال درمانی"],["p","مرحله آیین توضیح اثر روان‌شناختی"],["p","انتخاب سنگ دقت در انتخاب احساس کنترل"],["p","پاکسازی مراسم تمیز کردن نظم و امنیت"],["p","چیدمان قرار دادن روی بدن توجه به بدن"],["p","جمع‌بندی تشکر و پایان احساس کامل بودن"],["call","مثال ملموس: مراجع با اضطراب. درمانگر یک آیین سه‌مرحله‌ای اجرا می‌کند: (۱) انتخاب سنگ (آمتیست)، (۲) پاکسازی با دود، (۳) چیدمان روی سینه. این آیین، به مراجع احساس کنترل و امنیت می‌دهد."],["h2","۲.۵. بخش د: مکانیزم لمس حسی (Sensory Touch)"],["p","تعریف: لمس یک کریستال (سردی، صافی، وزن) توجه را به"],["p","بدن جلب می‌کند و نوعی ذهن‌آگاهی حسی (Sensory Mindfulness) ایجاد می‌کند. این مکانیزم، شبیه تکنیک‌های Grounding در درمان تروماست."],["p","شواهد: پژوهش‌ها نشان می‌دهند که تمرین‌های حسی (لمس، توجه به بدن) می‌توانند برانگیختگی را کاهش دهند و اضطراب را تعدیل کنند."],["cap","جدول ۲.۴: لمس حسی در کریستال درمانی"],["p","ویژگی سنگ اثر حسی کاربرد"],["p","سردی توجه به بدن کاهش برانگیختگی"],["p","صافی آرامش لمسی مدیتیشن"],["p","وزن احساس زمین‌گیری Grounding"],["p","زبری توجه به جزئیات ذهن‌آگاهی"],["call","مثال ملموس: مراجع با اضطراب. یک کوارتز شفاف سرد در دست. درمانگر از او می‌خواهد: «به سردی سنگ توجه کن. به وزن آن. به صافی آن.» این تمرین، توجه را از افکار اضطرابی به حس بدن می‌برد."],["h2","۲.۶. بخش ه: مکانیزم پاسخ شرطی‌شده (Conditioned Response)"],["p","تعریف: اگر یک کریستال با تجربه‌ای خوشایند (مثل آرامش) تداعی شود، تکرار آن می‌تواند پاسخ آرامش را فعال کند."],["cap","جدول ۲.۵: پاسخ شرطی‌شده در کریستال درمانی"],["p","مرحله توضیح مثال"],["p","تداعی اولیه سنگ + آرامش آمتیست + مدیتیشن"],["p","تکرار سنگ + آرامش هر شب"],["p","شرطی‌شدن سنگ ← آرامش آمتیست ← آرامش"],["call","مثال ملموس: مراجع هر شب قبل از خواب، یک آمتیست را در دست می‌گیرد و مدیتیشن می‌کند. بعد از دو هفته، فقط با دیدن آمتیست، احساس خواب‌آلودگی می‌کند. این یک پاسخ شرطی‌شده است."],["h2","۲.۷. جدول جمع‌بندی: مکانیزم‌های اثرگذاری"],["cap","جدول ۲.۶: مکانیزم‌ها و سطح شواهد"],["p","مکانیزم توضیح سطح شواهد"],["p","پیزوالکتریک خواص فیزیکی اثبات در فیزیک، بدون شواهد درمانی"],["p","پلاسیبو انتظار و باور قوی (روان‌شناختی)"],["p","آیین‌سازی مراسم نمادین قوی (روان‌شناختی)"],["p","لمس حسی توجه به بدن قوی (ذهن‌آگاهی)"],["p","پاسخ شرطی تداعی سنگ با آرامش قوی (رفتاری)"],["h2","۲.۸. نکته‌ی بالینی فصل"],["p","مکانیزم‌ها را به مراجع به‌عنوان «توضیح احتمالی» ارائه کن، نه «حقیقت قطعی». اگر مراجع علمی‌نگر است، بر مکانیزم‌های روان‌شناختی (پلاسیبو، آیین، لمس) تأکید کن. اگر مذهبی/معنوی است، می‌تواند «انرژی سنگ» را به‌عنوان چارچوب شخصی خودش نگه دارد. تطبیق زبان با جهان‌بینی مراجع، بخشی از مهارت است."],["h2","۲.۹. تمرین فصل ۲"],["p","سه مکانیزم روان‌شناختی کریستال درمانی را نام ببر و توضیح بده."],["p","یک کریستال شخصی را انتخاب کن و توضیح بده چرا با آرامش تداعی می‌شود (پاسخ شرطی)."],["cap","جدول ۲.۶ را مرور کن و برای هر مکانیزم، یک جمله‌ی بالینی بنویس."],["h2","۲.۱۰. خلاصه‌ی فصل"],["li","پیزوالکتریک: اثبات در فیزیک، بدون شواهد درمانی."],["li","پلاسیبو: انتظار و باور؛ اثر واقعی، اما نه از «انرژی»."],["li","آیین‌سازی: مراسم نمادین؛ احساس کنترل و امنیت."],["li","لمس حسی: توجه به بدن؛ کاهش برانگیختگی."],["li","پاسخ شرطی: تداعی سنگ با آرامش."],["li","مکانیزم‌های روان‌شناختی، شواهد قوی دارند."],["li",35],["h2","۲.۱۱. واژه‌نامه‌ی دوزبانه‌ی فصل"],["p",13],["p","پیزوالکتریک Piezoelectric"],["p",157],["p",158],["p","لمس حسی Sensory Touch"],["p",40],["p","ذهن‌آگاهی Mindfulness"],["p",162],["h2","۲.۱۲. فهرست تصاویر پیشنهادی فصل"],["p",20],["p","تصویر ۲.۱ پیزوالکتریک نمودار کوارتز تحت فشار"],["p","تصویر ۲.۲ مکانیزم‌ها اینفوگرافیک پنج‌گانه"],["p","تصویر ۲.۳ لمس حسی عکس دست با کریستال"],["p","اسلایدهای پاورپوینت مدرس (فصل ۲) — متن + دیالوگ"],["p",163],["li","متن: «فصل ۲: مبانی علمی و مکانیزم‌ها | چرا کریستال کار می‌کند؟»"],["li","دیالوگ: «خب، رسیدیم به سؤال اصلی: چرا؟ در این فصل، مسیر علمی اثرگذاری را دنبال می‌کنیم: از خواص فیزیکی تا مکانیزم‌های روان‌شناختی.»"],["p","اسلاید ۲ — خواص فیزیکی"],["li","متن: «پیزوالکتریک (Piezoelectric): اثبات در فیزیک | تعمیم به درمان: بدون شواهد»"],["li","دیالوگ: «کریستال‌ها خواص فیزیکی خاصی دارند. پیزوالکتریک در کوارتز، اثبات‌شده است: تولید بار الکتریکی در اثر فشار. اما تعمیم این اثر به درمان، جهش علمی است که شواهد کافی ندارد.»"],["p","اسلاید ۳ — پلاسیبو"],["li","متن: «Placebo: انتظار و باور | مطالعه French (2001): بدون تفاوت واقعی/تقلبی»"],["li","دیالوگ: «پلاسیبو: اثر انتظار و باور. یک مطالعه کلاسیک نشان داد هیچ تفاوت معناداری بین کریستال واقعی و تقلبی نیست. این یعنی اثر کریستال، عمدتاً از باور می‌آید، نه از خود سنگ. اما این اثر، واقعی است.»"],["p","اسلاید ۴ — آیین‌سازی"],["li","متن: «Ritualization: مراسم نمادین | احساس کنترل و امنیت»"],["li","دیالوگ: «آیین‌سازی: مراسم نمادین مثل انتخاب، پاکسازی و چیدمان. این مراسم، به مراجع احساس کنترل و امنیت می‌دهد. مغز را از حالت تهدید به حالت امن می‌برد.»"],["p","اسلاید ۵ — لمس حسی"],["li","متن: «Sensory Touch: سردی، صافی، وزن | توجه به بدن | Grounding»"],["li","دیالوگ: «لمس حسی: سردی، صافی، وزن سنگ. این ویژگی‌ها توجه را به بدن جلب می‌کنند. شبیه تکنیک‌های Grounding در درمان تروما. کاهش برانگیختگی.»"],["p","اسلاید ۶ — پاسخ شرطی"],["li","متن: «Conditioned Response: تداعی سنگ با آرامش | تکرار»"],["li","دیالوگ: «پاسخ شرطی‌شده: اگر یک سنگ با آرامش تداعی شود، تکرار آن می‌تواند پاسخ آرامش را فعال کند. مثال: آمتیست هر شب قبل از خواب. بعد از دو هفته، فقط با دیدن آمتیست، خواب‌آلودگی.»"],["p","اسلاید ۷ — جدول مکانیزم‌ها"],["li","متن: «پیزوالکتریک: بدون شواهد درمانی | پلاسیبو، آیین، لمس، شرطی: شواهد قوی»"],["li","دیالوگ: «این جدول را ببینید. پیزوالکتریک در فیزیک اثبات‌شده، اما در درمان بدون شواهد. چهار مکانیزم روان‌شناختی، شواهد قوی دارند: پلاسیبو، آیین‌سازی، لمس"],["p","حسی، پاسخ شرطی.»"],["p","اسلاید ۸ — مثال بالینی"],["li","متن: «کوارتز سرد در دست | توجه به سردی و وزن | کاهش اضطراب»"],["li","دیالوگ: «مثال بالینی: مراجع با اضطراب. یک قیت، جنسیت"],["p","شبکه خورشیدی Manipura بالای ناف زرد قدرت، اعتماد به نفس"],["p","قلب Anahata مرکز سینه سبز عشق، شفقت"],["p","گلو Vishuddha گلو آبی بیان، ارتباط"],["p","ابرو (چشم سوم) Ajna بین ابروها نیلی شهود، بصیرت"],["p","تاج Sahasrara بالای سر بنفش/سفید معنویت، اتصال"],["call","مثال ملموس: مراجع با ترس از صحبت در جمع. این ترس، با چاکرای گلو (Vishuddha) مرتبط است. درمانگر کریستال‌های آبی (فیروزه، آکوامارین) را انتخاب می‌کند. مراجع با اضطراب کلی، با چاکرای ریشه (Muladhara) مرتبط است؛ درمانگر کریستال‌های قرمز (عقیق، یاسپر) انتخاب می‌کند."],["h2","۳.۳. بخش ب: چاکراها از نگاه روان‌شناختی"],["p","هر چاکرا، یک حوزه‌ی روان‌شناختی را نمایندگی می‌کند. این نقشه، برای فرمول‌بندی موردی (Case Formulation) بسیار مفید است."],["cap","جدول ۳.۲: چاکراها و حوزه‌های روان‌شناختی"],["p","چاکرا حوزه روان‌شناختی اختلال مرتبط کریستال پیشنهادی"],["p","ریشه امنیت، بقا اضطراب فراگیر، ترس عقیق قرمز، یاسپر"],["p","خاجی خلاقیت، جنسیت بلوک خلاقیت، مشکلات جنسی کارنلیان، کهربا"],["p","شبکه خورشیدی قدرت، اعتماد به نفس اعتماد به نفس پایین سیترین، چشم ببر"],["p","قلب عشق، شفقت شرم، انزوا زمرد، کوارتز صورتی"],["p","گلو بیان، ارتباط ترس از صحبت، بلوک بیان فیروزه، آکوامارین"],["p","ابرو شهود، بصیرت سردرگمی، عدم تمرکز لاجورد، فلوریت"],["p","تاج معنویت، اتصال احساس بی‌معنایی آمتیست، کوارتز شفاف"],["call","مثال ملموس: مراجع با اعتماد به نفس پایین. این مشکل، با چاکرای شبکه خورشیدی (Manipura) مرتبط است. درمانگر کریستال‌های زرد (سیترین، چشم ببر) را انتخاب می‌کند. مراجع با شرم، با چاکرای قلب (Anahata) مرتبط است؛ کریستال‌های سبز/صورتی (زمرد، کوارتز صورتی)."],["h2","۳.۴. بخش ج: چاکراها و رنگ‌ها (پیوند با رنگ درمانی)"],["p","هر چاکرا، یک رنگ خاص دارد. این پیوند، کریستال درمانی را با رنگ درمانی (جزوه‌ی قبلی) مرتبط می‌کند."],["cap","جدول ۳.۳: پیوند چاکرا، رنگ و کریستال"],["p","چاکرا رنگ کریستال‌های اصلی کریستال‌های مکمل"],["p","ریشه قرمز عقیق، یاسپر تورمالین سیاه"],["p","خاجی نارنجی کارنلیان، کهربا کلسیت نارنجی"],["p","شبکه خورشیدی زرد سیترین، چشم ببر توپاز"],["p","قلب سبز زمرد، آونتورین کوارتز صورتی"],["p","گلو اکرا را با رنگ و حوزه‌ی روان‌شناختی‌شان بنویس."],["p","برای یک مراجع با «اعتماد به نفس پایین»، چاکرا و کریستال مناسب را انتخاب کن."],["p",166],["h2",48],["li","هفت چاکرا: ریشه، خاجی، شبکه خورشیدی، قلب، گلو، ابرو، تاج."],["li","هر چاکرا: رنگ، حوزه‌ی روان‌شناختی، کریستال."],["li","چاکراها، چارچوب نمادین‌اند، نه ساختار تشریحی اثبات‌شده."],["li","چیدمان کریستال، یک آیین آرام‌بخش است."],["li","نقشه، ابزار است؛ مراجع، اولویت."],["h2",50],["p",13],["p",167],["p","ریشه Root (Muladhara)"],["p","خاجی Sacral (Svadhisthana)"],["p","شبکه خورشیدی Solar Plexus (Manipura)"],["p","قلب Heart (Anahata)"],["p","گلو Throat (Vishuddha)"],["p","ابرو Third Eye (Ajna)"],["p","تاج Crown (Sahasrara)"],["p",168],["h2",53],["p",20],["p","تصویر ۳.۱ هفت چاکرا نمودار بدن با هفت چاکرا"],["p","تصویر ۳.۲ پیوند رنگ/کریستال جدول تصویری"],["p","تصویر ۳.۳ چیدمان عکس چیدمان هفت‌چاکرا"],["p","اسلایدهای پاورپوینت مدرس (فصل ۳) — متن + دیالوگ"],["p",163],["li","متن: «فصل ۳: چاکراها و کریستال‌ها | نقشه‌ی انتخاب سنگ»"],["li","دیالوگ: «این فصل، پایه‌ی نظری دایرةالمعارف کریستال‌هاست. سیستم چاکراها، یک نقشه برای انتخاب سنگ مناسب است.»"],["p","اسلاید ۲ — هفت چاکرا"],["li","متن: «ریشه (قرمز) | خاجی (نارنجی) | شبکه خورشیدی (زرد) | قلب (سبز) | گلو (آبی) | ابرو (نیلی) | تاج (بنفش)»"],["li","دیالوگ: «هفت چاکرا از پایین تا بالا: ریشه با رنگ قرمز، خاجی نارنجی، شبکه خورشیدی زرد، قلب سبز، گلو آبی، ابرو نیلی، تاج بنفش. هر چاکرا، یک رنگ و یک حوزه روان‌شناختی دارد.»"],["p","اسلاید ۳ — چاکرا و روان‌شناسی"],["li","متن: «ریشه: امنیت | خاجی: خلاقیت | شبکه خورشیدی: قدرت | قلب: عشق | گلو: بیان | ابرو: شهود | تاج: معنویت»"],["li","دیالوگ: «هر چاکرا یک حوزه روان‌شناختی را نمایندگی می‌کند: ریشه امنیت، خاجی خلاقیت، شبکه خورشیدی قدرت، قلب عشق، گلو بیان، ابرو شهود، تاج معنویت. این نقشه، برای فرمول‌بندی موردی مفید است.»"],["p","اسلاید ۴ — مثال چاکرا"],["li","متن: «ترس از صحبت: چاکرای گلو (آبی) | اعتماد به نفس پایین: شبکه خورشیدی (زرد)»"],["li","دیالوگ: «دو مثال: مراجع با ترس از صحبت، چاکرای گلو با کریستال آبی. مراجع با اعتماد به نفس پایین، چاکرای شبکه خورشیدی با کریستال زرد. نقشه، انتخاب را آسان می‌کند.»"],["p","اسلاید ۵ — پیوند رنگ و کریستال"],["li","متن: «ریشه: عقیق | خاجی: کارنلیان | شبکه خورشیدی: سیترین | قلب: زمرد | گلو: فیروزه | ابرو: لاجورد | تاج: آمتیست»"],["li","دیالوگ: «هر چاکرا، کریستال خودش را دارد: عقیق برای ریشه، کارنلیان برای خاجی، سیترین برای شبکه خورشیدی، زمرد برای قلب، فیروزه برای گلو، لاجورد برای ابرو، آمتیست برای تاج.»"],["p","اسلاید ۶ — چیدمان"],["li","متن: «چیدمان هفت‌چاکرا | ۱۵-۲۰ دقیقه | آیین آرام‌بخش»"],["li","دیالوگ: «چیدمان هفت‌چاکرا: قرار دادن کریستال‌ها روی نقاط چاکرا. ۱۵ تا ۲۰ دقیقه. یک آیین آرام‌بخش که توجه را به بدن جلب می‌کند.»"],["p","اسلاید ۷ — مثال چیدمان"],["li","متن: «اضطراب + بی‌خوابی: عقیق، کارنلیان، سیترین، کوارتز صورتی، فیروزه، لاجورد، آمتیست»"],["li","دیالوگ: «مثال چیدمان: مراجع با اضطراب و بی‌خوابی."],["p","هفت کریستال روی هفت چاکرا. ۱۵ دقیقه با تنفس عمیق. بعد از جلسه، آرامش و تعادل بیشتر.»"],["p","اسلاید ۸ — صداقت علمی"],["li","متن: «چاکراها: چارچوب نمادین | نه ساختار تشریحی اثبات‌شده | نقشه، نه حقیقت مطلق»"],["li","دیالوگ: «صداقت علمی: چاکراها ساختار تشریحی اثبات‌شده ندارند. یک چارچوب نمادین هستند. نقشه، نه حقیقت مطلق. اگر مراجع علمی‌نگر است، بگویید این یک چارچوب برای سازمان‌دهی کار ماست.»"],["p",164],["li","متن: «نقشه، ابزار است | مراجع، اولویت | تطبیق شخصی»"],["li","دیالوگ: «نکته بالینی: چاکراها نقشه‌اند، ابزار. اما مراجع، اولویت است. اگر مراجع با کریستال قرمز هم آرام شد، آن را بپذیرید. تطبیق شخصی، بخشی از مهارت است.»"],["p",165],["li","متن: «هفت چاکرا، هفت رنگ، هفت کریستال | نقشه‌ی انتخاب | چارچوب نمادین»"],["li","دیالوگ: «حرف آخر: هفت چاکرا، هفت رنگ، هفت کریستال. یک نقشه برای انتخاب. یک چارچوب نمادین. فصل بعد می‌رویم سراغ فصل اختصاصی شما: شناسایی، پاکسازی و شناخت کریستال‌ها.»"]]},{"n":4,"title":"شناسایی، پاکسازی و شناخت کریستال‌ها (از نگاه جواهرشناس و کریستال‌شناس)","blocks":[["h2",54],["p","این فصل، «پل» بین دنیای معدنی و دنیای درمانی است. قبل از اینکه یک کریستال را روی بدن مراجع بگذارید، باید بدانید: این سنگ واقعاً چیست؟ اصل است یا تقلبی؟ تراش خورده بهتر است یا خام؟ انگشتر بگذاریم یا در جیب؟ و مهم‌تر: چگونه آن را «پاکسازی» کنیم؟ این فصل، با نگاه یک جواهرشناس (برای شناسایی) و یک کریستال‌شناس (برای پاکسازی و استفاده) تدوین شده است. نکته‌ی صداقت علمی: «پاکسازی انرژی» یک باور سنتی/معنوی است، نه یک فرایند فیزیکی اثبات‌شده. اما به‌عنوان یک آیین روان‌شناختی، می‌تواند اثر آرام‌بخش داشته باشد."],["h2","۴.۲. بخش الف: دسته‌بندی کریستال‌ها (قیمتی، نیمه‌قیمتی، درمانی)"],["cap","جدول ۴.۱: دسته‌بندی سنگ‌ها از نگاه جواهرشناسی"],["p","دسته تعریف مثال‌ها کاربرد اصلی"],["p","سنگ‌های قیمتی (Precious) نادر، شفاف، با ارزش بالا الماس (Diamond)، یاقوت سرخ (Ruby)، زمرد (Emerald)، یاقوت کبود (Sapphire) جواهرات لوکس"],["p","سنگ‌های نیمه‌قیمتی (Semi-precious) فراوان‌تر، متنوع، ارزش متوسط عقیق (Agate)، فیروزه (Turquoise)، آمتیست (Amethyst)، کوارتز (Quartz)، تورمالین (Tourmaline) جواهرات، درمان"],["p","کریستال‌های درمانی (Healing Crystals) اصطلاحی تجاری/درمانی، نه معدنی کوارتز شفاف، آمتیست، سلنیت، فلوریت مدیتیشن، آیین"],["call","نکته‌ی مهم: «کریستال درمانی» یک دسته‌ی معدنی نیست؛ یک برچسب تجاری/درمانی است. بسیاری از سنگ‌های «نیمه‌قیمتی» (مثل آمتیست و کوارتز) در کریستال درمانی استفاده می‌شوند. بنابراین، «نیمه‌قیمتی» به معنای «کم‌ارزش» نیست؛ فقط از نظر تجاری، فراوان‌تر و ارزان‌تر از چهار سنگ"],["p","قیمتی اصلی است."],["call","مثال ملموس: یک انگشتر عقیق (نیمه‌قیمتی) می‌تواند از نظر درمانی/نمادین، همان‌قدر «ارزشمند» باشد که یک انگشتر یاقوت (قیمتی). ارزش درمانی، به باور و آیین وابسته است، نه به قیمت بازار."],["h2","۴.۳. بخش ب: شناسایی اصل از غیراصل (از نگاه جواهرشناس)"],["p","اینجا باید صریح باشیم: تشخیص قطعی اصالت سنگ، فقط در آزمایشگاه گوهرشناسی معتبر امکان‌پذیر است. اما چند نشانه و روش ساده وجود دارد که به شما کمک می‌کند در خرید، هوشیارتر باشید."],["cap","جدول ۴.۲: نشانه‌های تقلبی بودن سنگ‌ها"],["p","سنگ تقلب رایج نشانه روش تشخیص ساده"],["p","فیروزه (Turquoise) هولیت رنگ‌شده (Dyed Howlite) رنگ بیش از حد یکنواخت، رگه‌های غیرطبیعی سختی: هولیت"],["h2","۳.۵، فیروزه ۵-۶ (با چاقوی فولادی تست کنید)"],["p","سیترین (Citrine) آمتیست حرارت‌دیده رنگ نارنج د یا نور ماه استفاده کنید."]]}],"color":[{"n":1,"title":"درآمدی بر رنگ درمانی","blocks":[["h2",0],["p","تصور کنید مراجعی با افسردگی فصلی وارد اتاق درمان می‌شود. او می‌گوید: «در روزهای ابری زمستان، هیچ‌چیز برایم لذت‌بخش نیست.» در همین لحظه، یک نور درمانی با طیف آبی یا سفید روشن می‌تواند حال او را دگرگون کند. یا تصور کنید کودکی با اضطراب شدید، در اتاقی کاملاً قرمز و پرتحرک قرار دارد و هر لحظه آشفته‌تر می‌شود. رنگ درمانی (Color Therapy) یا کروموتراپی (Chromotherapy) پلی است میان فیزیولوژی مغز، روان‌شناسی ادراک و سنت‌های باستانی شفا. این فصل، نقشه‌ی راه ماست: از تعریف و تاریخچه تا جایگاه علمی و بالینی."],["h2","۱.۲. تعریف رنگ درمانی"],["p","رنگ درمانی، استفاده‌ی نظام‌مند از رنگ‌ها و نور برای تأثیر بر وضعیت جسمی، روانی و هیجانی فرد است. این تأثیر از سه مسیر اصلی اعمال می‌شود:"],["p","مسیر فیزیولوژیک: نور با طول‌موج خاص، بر گیرنده‌های شبکیه اثر می‌گذارد و از طریق مسیرهای عصبی به مغز (هیپوتالاموس و غده‌ی صنوبری) می‌رسد."],["p","مسیر روان‌شناختی: رنگ‌ها با خاطرات، نمادها و فرهنگ ما پیوند دارند و پاسخ‌های هیجانی ایجاد می‌کنند."],["p","مسیر آیینی/تجسمی: تجسم رنگ و تمرکز بر آن، یک تمرین ذهن‌آگاهی و خودشفقتی است."],["call","نکته‌ی مهم: رنگ درمانی، یک درمان مکمل (Complementary Therapy) است، نه جایگزین درمان‌های اصلی. برای پزشکان، این یعنی می‌توان از آن به‌عنوان یک ابزار کمکی در کنار پروتکل‌های استاندارد استفاده کرد."],["h2","۱.۳. تاریخچه‌ی کوتاه (از مصر تا قرن بیستم)"],["li","مصر باستان: استفاده از اتاق‌های رنگ‌شده و نور خورشید از میان شیشه‌های رنگی برای درمان بیماری‌ها. معابد «رنگ درمانی» داشتند."],["li","یونان باستان: بقراط و جالینوس، رنگ‌ها را با عناصر چهارگانه (آتش، آب، خاک، باد) و اخلاط چهارگانه مرتبط می‌دانستند."],["li","هند باستان: سیستم چاکراها (Chakras) و ارتباط هر چاکرا با یک رنگ خاص."],["li","قرن نوزدهم: ادوین بابیت (Edwin Babbitt) در سال ۱۸۷۶ کتابی درباره «اصول نور و رنگ» منتشر کرد و رنگ درمانی مدرن را پایه‌گذاری کرد."],["li","قرن بیستم: راندولف استون (Randolph Stone) بنیان‌گذار «پلارتی‌تراپی» (Polarity Therapy) و رودولف اشتاینر (Rudolf Steiner) در حوزه‌ی رنگ و تربیت لی است، نه جایگزین."],["h2",12],["p",13],["p",275],["p",276],["p",16],["p",40],["p",167],["p",277],["h2",19],["p",20],["p",161],["p","تصویر ۱.۲ رنگ در برابر نور جدول مقایسه‌ای"],["p","تصویر ۱.۳ سه مسیر اثر اینفوگرافیک فیزیولوژیک/روان‌شناختی/آیینی"]]},{"n":2,"title":"مبانی علمی رنگ درمانی","blocks":[["h2",21],["p","در فصل ۱ دیدیم رنگ درمانی چیست و از کجا آمده. حالا سؤال اصلی: چرا و چگونه کار می‌کند؟ این فصل، مسیر علمی اثرگذاری رنگ و نور را دنبال می‌کند: از گیرنده‌های نوری شبکیه تا هیپوتالاموس و غده‌ی صنوبری، و از آنجا تا ترشح هورمون‌ها و پاسخ‌های فیزیولوژیک. هدف این نیست که رنگ درمانی را «اثبات» کنیم، بلکه این است که بدانیم چه توضیح‌های علمی برای اثرگذاری آن وجود دارد و کدام‌شان پژوهش‌محورترند."],["h2","۲.۲. مسیر نور: از چشم تا مغز"],["p","نور، از طریق گیرنده‌های نوری (Photoreceptors) شبکیه دریافت می‌شود: مخروط‌ها (Cones) مسئول دید رنگی هستند و میله‌ها (Rods) مسئول دید در نور کم. اما نکته‌ی"],["p","مهم‌تر این است که نوع خاصی از سلول‌های گانگلیونی شبکیه، به نام سلول‌های گانگلیونی حساس به نور (ipRGCs – Intrinsically Photosensitive Retinal Ganglion Cells)، نور را مستقیماً به هیپوتالاموس (Hypothalamus) و غده‌ی صنوبری (Pineal Gland) می‌فرستند. این مسیر، مستقل از «دیدن» است و بر ساعت زیستی (Circadian Rhythm) و ترشح ملاتونین اثر می‌گذارد."],["cap","جدول ۲.۱: مسیرهای اثر نور بر مغز"],["p","مسیر عملکرد نتیجه"],["p","مخروط‌ها و میله‌ها دید رنگی و نور کم ادراک بصری"],["p","ipRGCs تنظیم ساعت زیستی ترشح ملاتونین"],["p","هیپوتالاموس مرکز تنظیم هورمون تغییر خلق و انرژی"],["p","غده‌ی صنوبری ترشح ملاتونین خواب و بیداری"],["call","مثال ملموس: قرار گرفتن در معرض نور آبی روشن در صبح (مثل نور خورشید یا لایت‌باکس) ترشح ملاتونین را کاهش می‌دهد و هوشیاری را افزایش می‌دهد. برعکس، نور قرمز/کهربایی در شب، ملاتونین را کمتر مختل می‌کند و به خواب"],["p","کمک می‌کند."],["h2","۲.۳. رنگ و هورمون‌ها"],["p","نور و رنگ می‌توانند بر ترشح چند هورمون کلیدی اثر بگذارند:"],["cap","جدول ۲.۲: اثر رنگ/نور بر هورمون‌ها"],["p","هورمون اثر نور/رنگ نتیجه"],["p","ملاتونین (Melatonin) نور آبی/سفید روشن: کاهش کاهش خو واند تعیین مرز کند (مثلاً لباس رسمی درمانگر). اما در مقادیر زیاد، می‌تواند سنگینی و انزوا ایجاد کند."],["cap","جدول ۶.۲: سیاه در یک نگاه"],["p",57],["p","اثر روان‌شناختی قدرت، مرز، رسمیت"],["p","کاربرد درمانی تعیین مرز، لباس رسمی، سوگ"],["p",289],["p",280],["p","تعیین مرز: لباس سیاه رسمی در جلسه‌ی اول، می‌تواند مرز حرفه‌ای را تقویت کند."],["p","سوگ: در آیین‌های سوگ، سیاه به بیان اندوه کمک می‌کند."],["p","قدرت: در موقعیت‌هایی که نیاز به قدرت و اعتماد است، یک شیء سیاه کوچک می‌تواند کمک کند."],["call","مثال ملموس: درمانگری که در جلسه‌ی اول با یک لباس رسمی سیاه/سرمه‌ای حاضر می‌شود. این لباس، مرز حرفه‌ای را تقویت می‌کند، بدون اینکه سردی ایجاد کند."],["h2","۶.۴. بخش ج: خاکستری (Gray)"],["p","معنای جهانی: خنثی، تعادل، ابهام"],["p","نماد در ایران: رسمیت، خنثی"],["p","اثرات روان‌شناختی: خاکستری، رنگی خنثی و متعادل است."],["p","در محیط‌های کاری، خاکستری می‌تواند تمرکز و آرامش بدهد. اما در مقادیر زیاد، می‌تواند بی‌حسی و ابهام ایجاد کند."],["cap","جدول ۶.۳: خاکستری در یک نگاه"],["p",57],["p","اثر روان‌شناختی خنثی، تعادل، ابهام"],["p","کاربرد درمانی محیط کار، لباس رسمی، فضای خنثی"],["p",289],["p",280],["p","محیط کار: دیوارهای خاکستری روشن، تمرکز را تقویت می‌کنند."],["p","لباس رسمی: خاکستری، رنگی «حرفه‌ای» است که مرز و تعادل را نشان می‌دهد."],["p","فضای خنثی: در جلسه‌ی اول، فضای خاکستری می‌تواند «فضای امن و خنثی» ایجاد کند."],["call","مثال ملموس: مطب روان‌شناسی با دیوارهای خاکستری روشن"],["p","و مبلمان ساده. این فضا، تمرکز و آرامش می‌دهد، بدون تحریک."],["h2","۶.۵. بخش د: صورتی (Pink)"],["p","معنای جهانی: عشق، مراقبت، ظرافت"],["p","نماد در ایران: دخترانگی، محبت، لطافت"],["p","اثرات روان‌شناختی: صورتی، رنگی ملایم و آرام‌بخش است که با مراقبت و محبت پیوند دارد. در برخی مطالعات، صورتی ملایم می‌تواند اضطراب را کاهش دهد. در محیط‌های کودکان، صورتی احساس امنیت می‌دهد."],["cap","جدول ۶.۴: صورتی در یک نگاه"],["p",57],["p","اثر روان‌شناختی عشق، مراقبت، آرامش"],["p","کاربرد درمانی کودکان، شرم، خودارزشمندی"],["p",287],["p",280],["p","کودکان: اتاق صورتی ملایم برای کودکان، احساس امنیت می‌دهد."], نتخاب رنگ"]]},{"n":7,"title":"رنگ درمانی برای اضطراب و افسردگی","blocks":[["h2",73],["p","در فصل‌های ۴ تا ۶، رنگ‌ها را تک‌به‌تک شناختیم. حالا می‌رسیم به سؤال اصلی: چگونه از این رنگ‌ها در کار بالینی استفاده کنیم؟ این فصل، دو حوزه‌ی اصلی سلامت روان را بررسی می‌کند: اضطراب و افسردگی. برای هر حوزه، پروتکل، رنگ‌های پیشنهادی، شواهد و مثال بالینی ارائه می‌شود."],["h2","۷.۲. بخش الف: رنگ درمانی و اضطراب"],["p","شیوع و اهمیت: اضطراب، شایع‌ترین اختلال روانی است. رنگ درمانی، به‌عنوان یک مداخله‌ی مکمل، در کاهش اضطراب موقعیتی (قبل از عمل، امتحان) و اضطراب مزمن (GAD) کاربرد دارد."],["p","شواهد: یک کارآزمایی بالینی تصادفی‌شده در ایران (شیراز)"],["p","روی ۶۰ بیمار همودیالیزی نشان داد رنگ درمانی به‌طور معناداری اضطراب بیماران را کاهش داد. این شواهد، رنگ درمانی را به‌عنوان یک مداخله‌ی مکمل در محیط‌های درمانی پشتیبانی می‌کند."],["p","پروتکل رنگ درمانی برای اضطراب:"],["cap","جدول ۷.۱: پروتکل اضطراب"],["p",292],["p","اضطراب حاد (امتحان) آبی/سبز استنشاق/تجسم ۵ دقیقه قبل"],["p","اضطراب پیش از عمل آبی/سبز محیط/لباس ۲۰ دقیقه قبل"],["p","اضطراب مزمن آبی/سبز + بنفش محیط/دیفیوزر (نور) روزانه"],["p","اضطراب اجتماعی سبز لباس قبل از موقعیت"],["call","مثال ملموس: مراجع با اضطراب امتحان. یک لباس سبز ملایم، پنج دقیقه قبل از ورود به جلسه. یا تجسم رنگ آبی آرام. این مداخله‌ی ساده، برانگیختگی را کاهش می‌دهد."],["h2","۷.۳. بخش ب: رنگ درمانی و افسردگی"],["p","شیوع و اهمیت: افسردگی، یکی از علل اصلی ناتوانی در جهان است. رنگ درمانی، به‌عنوان مداخله‌ی مکمل، می‌تواند در بهبود خلق و کاهش نشانه‌های خفیف تا متوسط کمک کند."],["p","شواهد: یک مطالعه مروری در ایران اشاره می‌کند که رنگ درمانی می‌تواند در کاهش نشانه‌های افسردگی مؤثر باشد، اما نیاز به پژوهش‌های بیشتر دارد. در حوزه‌ی نور درمانی (که با رنگ درمانی مرتبط است)، شواهد قوی برای افسردگی فصلی (SAD) وجود دارد."],["p","پروتکل رنگ درمانی برای افسردگی خفیف:"],["cap","جدول ۷.۲: پروتکل افسردگی خفیف"],["p","هدف رنگ پیشنهادی روش زمان"],["p","بهبود خلق زرد/نارنجی محیط/لباس صبح"],["p","افزایش انرژی قرمز ملایم لباس/شیء صبح"],["p","کاهش احساس سردی نارنجی/صورتی پتو/محیط عصر"],["p",283],["call","مثال ملموس: مراجع با افسردگی خفیف. صبح: یک شال قرمز ملایم. عصر: یک پتوی نارنجی. این ترکیب، انرژی ملایم را در طول روز حفظ می‌کند."],["call","هشدار: در افسردگی شدید با افکار خودکشی، ارجاع فوری به روان‌پزشک. رنگ درمانی، در این موارد، ممنوع است."],["h2","۷.۴. بخش ج: جدول مقایسه‌ای اضطراب و افسردگی"],["cap","جدول ۷.۳: رنگ درمانی در اضطراب و افسردگی"],["p","معیار اضطراب افسردگی"],["p","رنگ اصلی آبی، سبز زرد، نارنجی"],["p","رنگ مکمل بنفش قرمز ملایم"],["p","رنگ ممنوع قرمز شدید آبی تیره"],["p","روش ترجیحی محیط/تجسم لباس/محیط"],["p","شواهد متوسط (کارآزمایی ایرانی) محدود (مرور)"],["h2","۷.۵. بخش د: پروتکل ترکیبی (اضطراب + افسردگی)"],["p","گاهی مراجع هم اضطراب دارد و هم افسردگی (اختلال اضطراب-افسردگی مختلط). در این موارد:"],["cap","جدول ۷.۴: پروتکل ترکیبی"],["p",293],["p","صبح زرد ملایم افزایش انرژی و خلق"],["p","بعدازظهر سبز تعادل و کاهش اضطراب"],["p","عصر نارنجی ملایم احساس گرما"],["p","شب بنفش ملایم آرامش و خواب"],["call","مثال ملموس: مراجع با اضطراب-افسردگی مختلط. صبح: زرد ملایم (انرژی). بعدازظهر: سبز (تعادل). عصر: نارنجی (گرما). شب: بنفش (آرامش). این چرخه، تعادل را در طول روز حفظ می‌کند."],["h2",75],["p","در کار با اضطراب و افسردگی، مرز شواهد را شفاف کن. برای"],["p","اضطراب، شواهد متوسط (کارآزمایی ایرانی) داریم. برای افسردگی خفیف، شواهد محدودتر است. هرگز رنگ درمانی را جایگزین درمان پزشکی نکن. اگر مراجع با افکار خودکشی، بی‌قراری شدید یا علائم روان‌پریشی مراجعه کرد، ارجاع فوری به روان‌پزشک."],["h2",76],["p",86],["p","برای یک مراجع با افسردگی خفیف، یک پروتکل رنگ بنویس."],["p",294],["h2",77],["li","اضطراب: آبی/سبز (شواهد متوسط، کارآزمایی ایرانی)."],["li","افسردگی خفیف: زرد/نارنجی (شواهد محدود)."],["li",295],["li",296],["li",89],["h2",78],["p",13],["p",90],["p",91],["p","اختلال اضطراب-افسردگی مختلط Mixed Anxiety-Depressive Disorder"],["p",94],["p",268],["h2",82],["p",20],["p","تصویر ۷.۱ پروتکل اضطراب فلوچارت انتخاب رنگ"],["p","تصویر ۷.۲ پروتکل افسردگی اینفوگرافیک چرخه روز"],["p","تصویر ۷.۳ جدول مقایسه جدول دوستونی"]]},{"n":8,"title":"رنگ درمانی برای خواب و استرس","blocks":[["h2",83],["p","در فصل ۷ رنگ درمانی را برای اضطراب و افسردگی دیدیم. حالا به سراغ دو حوزه‌ی بسیار شایع می‌رویم: خواب و استرس. بی‌خوابی و استرس مزمن، دو مشکلی هستند که بسیاری از مراجعان با آنها دست‌وپنجه نرم می‌کنند. رنگ درمانی، به‌عنوان یک مداخله‌ی مکمل، می‌تواند در بهبود کیفیت خواب و کاهش استرس ادراک‌شده کمک کند. اما دقیقاً به همین دلیل، مرز شواهد باید شفاف باشد."],["h2","۸.۲. بخش الف: رنگ درمانی و خواب"],["p","شیوع و اهمیت: بی‌خوابی، یکی از شایع‌ترین شکایات بالینی است. رنگ درمانی، به‌ویژه از طریق نور محیط و تجسم، می‌تواند به خواب کمک کند."],["p","شواهد: در حوزه‌ی نور درمانی، شواهد قوی برای تأثیر نور بر ساعت زیستی (Circadian Rhythm) و ترشح ملاتونین وجود دارد. نور آبی روشن در صبح، ملاتونین را کاهش می‌دهد و هوشیاری را افزایش می‌دهد. برعکس، نور قرمز/کهربایی در شب، ملاتونین را کمتر مختل می‌کند و به خواب کمک می‌کند. در حوزه‌ی رنگ درمانی، شواهد مستقیم محدودتر است، اما پروتکل‌های عملی بر اساس همین یافته‌ها طراحی می‌شوند."],["cap","جدول ۸.۱: پروتکل رنگ درمانی برای خواب"],["p","مشکل رنگ پیشنهادی روش زمان"],["p","بی‌خوابی شروع خواب بنفش/آبی تیره لامپ/پتو ۳۰ دقیقه قبل"],["p","بیداری مکرر آبی ملایم لامپ شبانه شبانه"],["p","خواب بی‌کیفیت سبز ملایم محیط اتاق دائمی"],["p","اضطراب شبانه بنفش + آبی تجسم/لامپ قبل از خواب"],["call","مثال ملموس: مراجع با بی‌خوابی. یک لامپ بنفش ملایم در اتاق خواب، ۳۰ دقیقه قبل از خواب. یا یک پتوی آبی ملایم."],["p","این رنگ‌ها، آرامش عمیق می‌دهند و به خواب کمک می‌کنند."],["call","هشدار: نور آبی صفحه‌نمایش (موبایل، لپ‌تاپ) برعکس است و ملاتونین را مختل می‌کند. در پروتکل خواب، از صفحه‌نمایش‌های آبی قبل از خواب پرهیز کنید."],["h2","۸.۳. بخش ب: رنگ درمانی و استرس"],["p","شیوع و اهمیت: استرس مزمن، عامل خطر بسیاری از بیماری‌هاست. رنگ درمانی می‌تواند پاسخ استرس را تعدیل کند."],["p","شواهد: یک کارآزمایی بالینی تصادفی‌شده در ایران (شیراز) روی ۶۰ بیمار همودیالیزی نشان داد رنگ درمانی به‌طور معناداری اضطراب بیماران را کاهش داد. این یافته، رنگ درمانی را به‌عنوان یک مداخله‌ی مکمل در کاهش استرس محیطی پشتیبانی می‌کند."],["cap","جدول ۸.۲: پروتکل رنگ درمان function toFa(n){return String(n).replace(/[0-9]/g,d=>'۰۱۲۳۴۵۶۷۸۹'[+d]);}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

/* زمان ایران */
function tehran(){
const f=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tehran',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'});
const p={};f.formatToParts(new Date()).forEach(x=>p[x.type]=x.value);
return {key:p.year+'-'+p.month+'-'+p.day,hm:p.hour+':'+p.minute};
}
function addDays(key,n){const [y,m,d]=key.split('-').map(Number);return new Date(Date.UTC(y,m-1,d+n)).toISOString().slice(0,10);}
function dow(key){const [y,m,d]=key.split('-').map(Number);return new Date(Date.UTC(y,m-1,d)).getUTCDay();}
function dayName(key){return FA_DAYS[dow(key)];}
function dayLabel(key){return dayName(key)+' · '+toFa(key);}
function touchDay(){const k=tehran().key;const days=store.get('days',[]);if(!days.includes(k)){days.push(k);store.set('days',days.slice(-60));}}
function bestSet(g,v){const k='best:'+g;if(v>store.get(k,0))store.set(k,v);}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function allHikma(){return HIKMA.concat(store.get('hikmaC',[]).map(x=>x.t));}
function getGoals(k){return store.get('g:'+k,[]);}
function setGoals(k,l){store.set('g:'+k,l);}

let actx=null;
function tick(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const t=actx.currentTime,o=actx.createOscillator(),g=actx.createGain();o.type='triangle';o.frequency.setValueAtTime(1500,t);o.frequency.exponentialRampToValueAtTime(800,t+.04);g.gain.setValueAtTime(.09,t);g.gain.exponentialRampToValueAtTime(.001,t+.07);o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+.08);}catch(e){}}
function burst(x,y){
if(reduced()) return;
const fx=document.getElementById('fx');
const cols=['#ffb3c7','#ffe38a','#a8f0d8','#b9d8ff','#d9c2ff','#ffc8a2','#fff7b0','#9ff0ff'];
for(let i=0;i<40;i++){
const s=document.createElement('span'); s.className='spark';
const a=(i/40)*Math.PI*2+Math.random()*.25, d=70+Math.random()*130;
const c=cols[i%cols.length], sz=6+Math.random()*9;
s.style.left=x+'px'; s.style.top=y+'px'; s.style.width=sz+'px'; s.style.height=sz+'px';
s.style.background=c; s.style.boxShadow='0 0 12px '+c;
s.style.setProperty('--dx',Math.cos(a)*d+'px'); s.style.setProperty('--dy',Math.sin(a)*d+'px');
fx.appendChild(s); setTimeout(()=>s.remove(),1000);
}
}

/* نقطه‌ی مرکزی (Canvas) — بدون سایه‌ی سنگین برای روانی */
let F=null;
function gameFocus(){
return `<div class="card center" id="gstat"><p class="muted">با لمس و کشیدن روی صفحه، نقطه‌ی سفید را حرکت دهید و از برخورد با نورهای رنگی دور بمانید.</p></div>

<button class="btn s-rect" style="--c:#c7f0df;--d:#9ad8bb" onclick="startGame()">${playing?'شروع دوباره':'شروع بازی'}</button>`;
}
function startFocus(){
const cv=document.getElementById('cv'); if(!cv) return;
const w=Math.min(cv.clientWidth||340,480); const h=Math.min(Math.round(w*1.05),Math.round(window.innerHeight*0.45));
cv.width=w; cv.height=h;
const d=store.get('diff:focus','medium');
const cfg={easy:{n:3,s:1.1},medium:{n:5,s:1.8},hard:{n:8,s:2.6}}[d];
const bright=['#ff7fa0','#5fb8ff','#8cf06a','#ffd23f','#c77dff','#25e0c8'];
F={cv,ctx:cv.getContext('2d'),w,h,px:w/2,py:h/2,tx:w/2,ty:h/2,start:performance.now(),alive:true,score:0,lastTxt:'',
en:[...Array(cfg.n)].map(()=>({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()*2-1)*cfg.s,vy:(Math.random()*2-1)*cfg.s,r:14+Math.random()*10,c:bright[Math.floor(Math.random()*bright.length)]}))};
const aim=e=>{if(!F||!F.alive)return;const r=cv.getBoundingClientRect();F.tx=(e.clientX-r.left)*(cv.width/r.width);F.ty=(e.clientY-r.top)*(cv.height/r.height);};
cv.onpointerdown=aim; cv.onpointermove=e=>{if(e.buttons)aim(e);};
loopId=requestAnimationFrame(focusFrame);
}
function setStat(el,key,html){if(!el)return;if(el.dataset.k!==key){el.dataset.k=key;el.innerHTML=html;}}
function focusFrame(now){
if(!F) return; const {ctx,w,h}=F;
ctx.clearRect(0,0,w,h);
const st=document.getElementById('gstat');
if(F.alive){
F.px+=(F.tx-F.px)*.14; F.py+=(F.ty-F.py)*.14;
for(const e of F.en){ e.x+=e.vx; e.y+=e.vy; if(e.x<e.r||e.x>w-e.r) e.vx*=-1; if(e.y<e.r||e.y>h-e.r) e.vy*=-1;
if(F.alive&&Math.hypot(e.x-F.px,e.y-F.py)<e.r+11){F.alive=false;tick();} }
F.score=Math.floor((now-F.start)/1000);
setStat(st,'f'+F.score,`<p class="score">${toFa(F.score)} ثانیه</p><p class="muted center">بهترین: ${toFa(store.get('best:focus',0))} ثانیه</p>`);
} else if(!F.saved){ F.saved=true; bestSet('focus',F.score); touchDay(); tick();

function laneX(i){return R.lw*i+R.lw/2;}

cv.onpointerdown=e=>{if(!R.alive)return;const r=cv.getBoundingClientRect();const x=e.clientX-r.left;roadMove(x<r.width/2?-1:1);};

function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function drawCar(ctx,cx,top,body,win,isPlayer){
const w=Math.round(R.lw*.56), h=Math.round(w*1.5), x=cx-w/2;
ctx.fillStyle='rgba(60,80,100,.18)'; rr(ctx,x+3,top+6,w,h,w*.28); ctx.fill();
ctx.fillStyle=body; rr(ctx,x,top,w,h,w*.28); ctx.fill();
ctx.fillStyle=win; rr(ctx,x+w*.14,top+h*.16,w*.72,h*.2,w*.12); ctx.fill();
rr(ctx,x+w*.14,top+h*.62,w*.72,h*.16,w*.12); ctx.fill();
ctx.fillStyle='#2b2f36';
[[x-w*.08,top+h*.14],[x+w*1.0-w*.12,top+h*.14],[x-w*.08,top+h*.78],[x+w*1.0-w*.12,top+h*.78]].forEach(([wx,wy])=>{ctx.beginPath();ctx.ellipse(wx+w*.06,wy+h*.06,w*.1,h*.07,0,0,Math.PI*2);ctx.fill();});

}
function roadFrame(){

const _now=performance.now(); const k=Math.min(3,Math.max(0.2,(_now-(R.t||_now))/16.67)); R.t=_now;
ctx.clearRect(0,0,w,h);
ctx.setLineDash([22,18]); ctx.lineDashOffset=-(R.dist*2)%40; ctx.strokeStyle='#ffffffcc'; ctx.lineWidth=3;
for(let i=1;i<3;i++){ctx.beginPath();ctx.moveTo(i*R.lw,0);ctx.lineTo(i*R.lw,h);ctx.stroke();}
ctx.setLineDash([]);
const py=h-h*.2;

if(R.alive){
R.dist+=cfg.sp*k;
if(Math.random()<cfg.p*k){const lane=Math.floor(Math.random()*3);if(!R.cars.some(c=>c.lane===lane&&c.y<h*.3))R.cars.push({lane,y:-120,c:['#f7b9ab','#f7c6e4','#fbe3a1','#b8d8f8'][Math.floor(Math.random()*4)]});}
for(const c of R.cars) c.y+=cfg.sp*k;
R.cars=R.cars.filter(c=>c.y<h+140);
for(const c of R.cars){ if(R.alive&&c.lane===R.lane && c.y+h*.15>py && c.y<py+h*.15){R.alive=false;tick();} }
const sc=Math.floor(R.dist/50);
R.score=sc;
if(R.alive) setStat(st,'r'+sc,`<p class="score">امتیاز: ${toFa(sc)}</p><p class="muted center">بهترین: ${toFa(store.get('best:road',0))}</p>`);
} else if(!R.saved){ R.saved=true; bestSet('road',R.score); touchDay();
setStat(st,'end',`<p class="score">تصادف! امتیاز: ${toFa(R.score)}</p><p class="muted center">دکمه‌ی «شروع دوباره» را بزنید.</p>`); }
for(const c of R.cars) drawCar(ctx,laneX(c.lane),c.y,c.c,'#ffffffcc',false);
drawCar(ctx,laneX(R.lane),py,'#8fd1f0','#ffffffcc',true);
loopId=requestAnimationFrame(roadFrame);
}

function gameWheel(){

return `<div class="wheel"><div class="pin"></div><div class="disc" id="disc" style="background:${grad};transform:rotate(${rot}deg)"></div></div>

let spinning=false;
function wheelSpin(){
if(spinning) return;
const step=360/WHEEL.length; const idx=Math.floor(Math.random()*WHEEL.length);
const cur=store.get('wrot',0);
const extra=360*(5+Math.floor(Math.random()*3));
const c=idx*step+step/2;
const delta=(((360-c)-(cur%360))%360+360)%360;
const final=cur+extra+delta;
spinning=true;
const disc=document.getElementById('disc'); const btn=document.getElementById('spinBtn');
if(btn) btn.setAttribute('aria-disabled','true');
if(disc) disc.style.transform='rotate('+final+'deg)';
store.set('wrot',final);

spinning=false; store.set('wlast',idx);
const h=store.get('whist',[]); h.push(idx); store.set('whist',h); touchDay();

},4100);
}

<textarea id="hk" class="inp" rows="3" placeholder="متن کارت"></textarea>
<button class="btn s-oval" style="--c:#c7f0df;--d:#9ad8bb;margin-top:10px" onclick="addHikma()">افزودن کارت</button>
${custom.length?custom.map((c,i)=>`<div class="crow"><span>${esc(c.t)}</span><button class="pill" style="--c:#fbc7bb;--d:#e6a392" onclick="delHikma(${i})">حذف</button></div>`).join(''):'<p class="muted" style="margin-top:8px">هنوز کارتی اضافه نشده است.</p>'}
</div>`);
}
function addHikma(){
const v=((document.getElementById('hk')||{}).value||'').trim();
if(!v){toast('متن کارت را بنویسید');return;}
const c=store.get('hikmaC',[]); c.push({t:v.slice(0,300)}); store.set('hikmaC',c);
toast('کارت اضافه شد'); render();
}
function delHikma(i){const c=store.get('hikmaC',[]);c.splice(i,1);store.set('hikmaC',c);render();}

/* ===== ارتباط با مدرس ===== */
const ICONS={'جیمیل':'✉','واتساپ':'💬','تماس':'📞','روبیکا':'🟣','ایتا':'🟢','اینستاگرام':'📷'};
function openLink(href,label){const w=window.open(href,'_blank');if(!w)toast(label==='جیمیل'?'ایمیل: '+CONFIG.email:'نشانی: '+href);}
function contactBtn(label,href,c,d){
if(href) return `<button class="btn s-rect" style="--c:${c};--d:${d}" onclick="openLink('${href}','${label}')"><span>${ICONS[label]} ${label}</span></button>`;
return `<button class="btn s-rect" aria-disabled="true" style="--c:${c};--d:${d}" onclick="toast('نشانی ${label} به‌زودی فعال می‌شود')"><span>${ICONS[label]} ${label}</span><small>به‌زودی</small></button>`;
}
function pageContact(){
return wrap('ارتباط با مدرس',`
<div class="card center">
<img class="gold-big" src="${FULL}" alt="${CONFIG.teacher}">
<img class="gold-logo" src="${LOGO}" alt="لوگو">
<h2 style="margin-top:10px">${CONFIG.teacher}</h2>
<p class="muted">${CONFIG.subtitle}</p>
</div>
<div class="grid2">
${contactBtn('جیمیل','mailto:'+CONFIG.email,'#cfe6fb','#a2c8e8')}
${contactBtn('واتساپ','https://wa.me/'+CONFIG.whatsapp,'#c7f0df','#9ad8bb')}
${contactBtn('تماس','tel:'+CONFIG.phone,'#dcf5b4','#b5dc82')}
${contactBtn('روبیکا',CONFIG.rubika,'#d9cdf7','#b7a6e3')}
${contactBtn('ایتا',CONFIG.eita,'#fbeab0','#e3cb75')}
${contactBtn('اینستاگرام',CONFIG.instagram,'#ffdcc6','#eeb08c')}
</div>
<div class="card center">
<p class="muted">شماره و ایمیل:</p>
<p style="font-size:1.1em;font-weight:900;direction:ltr;margin-top:4px">${CONFIG.phone}</p>
<p class="muted" style="direction:ltr;margin-top:4px">${CONFIG.email}</p>
<p class="muted" style="margin-top:6px">روبیکا: @darmanbdaroo · ایتا: @energii21 · اینستاگرام: darman.b.d1</p>
<button class="pill" style="--c:#c9f0e4;--d:#97d6c0;margin-top:10px" onclick="copyNum()">کپی شماره</button>
</div>`);
}
function copyNum(){try{navigator.clipboard.writeText(CONFIG.phone).then(()=>toast('شماره کپی شد'),()=>toast(CONFIG.phone));}catch(e){toast(CONFIG.phone);}}

/* ===== صفحه‌ی اصلی و مسیرها ===== */
const PAGES={home:pageHome,domain:()=>pageDomain(route.arg),lesson:()=>pageLesson(route.arg),library:pageLibrary,book:()=>pageLibrary(),flash:pageFlash,games:()=>pageGame('memo'),game:()=>pageGame(route.arg),progress:pageProgress,breath:pageBreath,day:()=>pageDay(route.arg),teacher:pageTeacher,contact:pageContact};
function render(){
stopLoop();
const app=document.getElementById('app');
try{app.innerHTML=(PAGES[route.name]||pageHome)();touchDay();}
catch(e){app.innerHTML='<div class="card">خطا در نمایش صفحه. صفحه را تازه کنید.</div>';return;}
if(route.name==='game'&&route.arg==='focus'){playing?startFocus():idleCanvas('focus');}
if(route.name==='game'&&route.arg==='road'){playing?startRoad():idleCanvas('road');}
}
Object.assign(window,{go,back,openLink,startGame,toggleBreath,setMood,store,render,toast,memoFlip,toggleCh,flashNav,flashMark,flashFlip,flashReset,togglePlan:null,copyNum,markLesson,simonStart,simonTap,roadMove,wheelSpin,setDiff,addHikma,delHikma,setType,addGoal,toggleGoal,delGoal,enableAlerts});
render();
setInterval(checkReminders,15000);
checkReminders();
}catch(e){document.getElementById('app').textContent='خطا: '+e.message;}
})();
</script>

<script>if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});}</script>
